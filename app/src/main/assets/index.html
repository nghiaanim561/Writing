<!DOCTYPE html>
<html lang="vi">
<head>

<title>Luyện viết tiếng Anh A2–C1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,800;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{--fs:20px}
*{box-sizing:border-box;margin:0;padding:0;transition:none!important;animation:none!important}
html{-webkit-text-size-adjust:100%}
body{background:#fff;color:#000;font-family:Literata,Georgia,"Noto Serif","Times New Roman",serif;font-size:var(--fs);line-height:1.55;-webkit-tap-highlight-color:transparent}
#app{max-width:820px;margin:0 auto;padding:18px 22px 60px}
h1{font-size:1.55em;line-height:1.2;font-weight:800}
h2{font-size:1.25em;line-height:1.25;font-weight:800;margin:0 0 .4em}
h3{font-size:1em;font-weight:800;margin:1.1em 0 .4em;text-transform:uppercase;letter-spacing:.06em}
p{margin:.45em 0}
ul{margin:.4em 0 .4em 1.2em}
li{margin:.25em 0}
b{font-weight:800}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:3px solid #000;padding-bottom:10px;margin-bottom:16px}
.top .ttl{font-weight:800;font-size:.95em}
.small{font-size:.82em}
.muted{font-style:italic}
button,.btn{font:inherit;color:#000;background:#fff;border:2px solid #000;border-radius:6px;padding:.55em 1em;min-height:52px;cursor:pointer;font-weight:600;line-height:1.25}
button.pri{background:#000;color:#fff}
button.ghost{border-style:dashed}
button.tiny{min-height:40px;padding:.3em .7em;font-size:.85em}
button:disabled{border-style:dotted;color:#000;opacity:1;font-style:italic}
button:active{background:#000;color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.sp{justify-content:space-between}
.full{width:100%}
.box{border:2px solid #000;border-radius:6px;padding:12px 14px;margin:12px 0}
.box.thick{border-width:3px}
.box.dash{border-style:dashed}
.formula div{font-family:"Courier New",Courier,monospace;font-weight:700;font-size:.92em;padding:3px 0;border-bottom:1px dotted #000}
.formula div:last-child{border-bottom:0}
.ex{margin:.5em 0;padding-left:.7em;border-left:4px solid #000}
.ex .vi{font-style:italic;font-size:.9em}
.mi{margin:.55em 0}
.mi .w{text-decoration:line-through}
.lv{margin:20px 0 6px;display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:4px}
.lv h2{margin:0}
.ls{display:flex;width:100%;text-align:left;align-items:center;gap:12px;border:0;border-bottom:1px solid #000;border-radius:0;padding:12px 4px;background:#fff;min-height:64px;font-weight:400}
.ls:active{background:#000;color:#fff}
.ls .n{font-weight:800;min-width:2em;font-size:1.05em}
.ls .t{flex:1}
.ls .t .e{display:block;font-size:.8em;font-style:italic}
.ls .s{font-size:.85em;font-weight:800;white-space:nowrap}
.steps{display:flex;border:2px solid #000;border-radius:6px;overflow:hidden;margin:6px 0 16px}
.steps button{flex:1;border:0;border-radius:0;border-right:2px solid #000;min-height:46px;font-size:.88em}
.steps button:last-child{border-right:0}
.steps button.on{background:#000;color:#fff}
.vn{font-size:1.18em;font-weight:600;line-height:1.4;margin:.3em 0 .6em}
textarea{width:100%;font:inherit;color:#000;background:#fff;border:2px solid #000;border-radius:6px;padding:10px 12px;resize:vertical;line-height:1.5}
textarea:focus{outline:3px solid #000;outline-offset:1px}
.verdict{font-size:1.2em;font-weight:800;margin-bottom:.3em}
.ans{margin:.35em 0}
.diff ins{text-decoration:none;font-weight:800;border-bottom:3px solid #000}
.diff del{text-decoration:line-through}
.bar{height:14px;border:2px solid #000;border-radius:3px;margin:6px 0}
.bar i{display:block;height:100%;background:#000}
.err{border-bottom:1px dotted #000;padding:7px 0}
.err:last-child{border-bottom:0}
.model{white-space:pre-wrap}
.center{text-align:center}
.mt{margin-top:14px}
.hide{display:none!important}
.tag{display:inline-block;border:2px solid #000;border-radius:4px;padding:0 .4em;font-size:.75em;font-weight:800;margin-right:.3em;vertical-align:middle}
.big{font-size:2.2em;font-weight:800;line-height:1.1}
</style>
</head>
<body>
<div id="app"></div>
<script>
const L=[];const X={};
// ===== A2 =====
L.push({id:1,lv:"A2",vi:"Thì hiện tại đơn",en:"Present Simple",
th:`<p>Dùng để nói về <b>thói quen</b>, <b>sự thật</b>, <b>lịch trình cố định</b>.</p>
<ul><li>Chủ ngữ là <b>he / she / it</b> hoặc danh từ số ít → động từ thêm <b>-s / -es</b>.</li>
<li>Phủ định và câu hỏi dùng trợ động từ <b>do / does</b>, động từ chính về nguyên mẫu.</li>
<li>Trạng từ tần suất (always, usually, often, sometimes, never) đứng <b>trước động từ thường</b>, <b>sau động từ to be</b>.</li></ul>`,
f:["(+) S + V / V-s,es","(−) S + don't / doesn't + V","(?) Do / Does + S + V ?","S + always/usually/never + V"],
ex:[["She works from home on Fridays.","Cô ấy làm việc ở nhà vào thứ Sáu."],["I never eat breakfast.","Tôi không bao giờ ăn sáng."],["Does he speak English?","Anh ấy có nói tiếng Anh không?"]],
mi:[["She work in a bank.","She works in a bank.","Quên -s với ngôi thứ ba số ít."],["He doesn't likes it.","He doesn't like it.","Sau does/doesn't, động từ về nguyên mẫu."],["I go usually to work by bus.","I usually go to work by bus.","Trạng từ tần suất đứng trước động từ thường."]],
q:[["Tôi thường uống cà phê vào buổi sáng.",["I usually drink coffee in the morning.","I often drink coffee in the morning.","I usually drink coffee in the mornings."],"usually đứng trước drink"],
["Anh trai tôi làm việc ở một bệnh viện.",["My brother works at a hospital.","My brother works in a hospital.","My older brother works at a hospital.","My older brother works in a hospital."],"brother = he → works"],
["Cô ấy không thích đồ ăn cay.",["She doesn't like spicy food.","She does not like spicy food."],"doesn't + V nguyên mẫu"],
["Bạn có đi làm bằng xe buýt không?",["Do you go to work by bus?"],"Do + S + V ?"],
["Mặt trời mọc ở hướng đông.",["The sun rises in the east."],"sự thật hiển nhiên"]],
w:{p:"Viết 4–5 câu về một ngày bình thường của bạn (mấy giờ dậy, làm gì, khi nào nghỉ).",n:"4–5 câu",h:"Dùng ít nhất 2 trạng từ tần suất và 1 câu phủ định.",
m:`I usually get up at 7 a.m. I drink a cup of coffee and check my emails. I work on animation projects from 9 to 5. I don't work on Sundays. In the evening, I often read on my e-reader before bed.`}});

L.push({id:2,lv:"A2",vi:"Thì hiện tại tiếp diễn",en:"Present Continuous",
th:`<p>Dùng cho hành động <b>đang xảy ra ngay lúc nói</b>, việc <b>tạm thời dạo này</b>, hoặc <b>kế hoạch đã sắp xếp</b> trong tương lai gần.</p>
<ul><li>Công thức: <b>am / is / are + V-ing</b>.</li>
<li>Dấu hiệu: now, right now, at the moment, these days, Look!, Listen!</li>
<li>Động từ chỉ trạng thái (know, like, want, need, believe, understand) thường <b>không</b> chia tiếp diễn.</li></ul>`,
f:["(+) S + am/is/are + V-ing","(−) S + am/is/are + not + V-ing","(?) Am/Is/Are + S + V-ing ?","Kế hoạch: S + am/is/are + V-ing + thời gian tương lai"],
ex:[["I'm writing an email right now.","Tôi đang viết email ngay bây giờ."],["She's staying with her parents this month.","Tháng này cô ấy đang ở với bố mẹ (tạm thời)."],["We're flying to Hanoi on Friday.","Thứ Sáu chúng tôi bay ra Hà Nội (đã đặt vé)."]],
mi:[["I am knowing the answer.","I know the answer.","know là động từ trạng thái."],["She cooking now.","She is cooking now.","Thiếu to be."],["Look! It rains.","Look! It's raining.","Đang xảy ra → tiếp diễn."]],
q:[["Tôi đang đọc sách trên máy đọc sách.",["I am reading a book on my e-reader.","I'm reading a book on my e-reader.","I am reading a book on my ereader."],"am + V-ing"],
["Bây giờ trời đang mưa.",["It is raining now.","It's raining now.","It's raining right now.","It is raining right now."],"chủ ngữ giả It"],
["Dạo này cô ấy đang học tiếng Nhật.",["She is learning Japanese these days.","She's learning Japanese these days.","She is studying Japanese these days.","She's studying Japanese these days.","These days she is learning Japanese.","These days, she is learning Japanese.","These days she's studying Japanese."],"việc tạm thời: these days"],
["Họ không xem TV, họ đang nấu ăn.",["They are not watching TV, they are cooking.","They aren't watching TV, they're cooking.","They aren't watching TV. They're cooking.","They are not watching TV. They are cooking.","They're not watching TV, they're cooking."],"aren't + V-ing"],
["Tối mai chúng tôi sẽ gặp khách hàng (đã hẹn rồi).",["We are meeting a client tomorrow evening.","We're meeting a client tomorrow evening.","We are meeting the client tomorrow evening.","We're meeting the client tomorrow evening.","We are meeting a client tomorrow night.","We're meeting the client tomorrow night."],"lịch hẹn → hiện tại tiếp diễn"]],
w:{p:"Mô tả những gì đang diễn ra quanh bạn ngay lúc này (4–5 câu). Thêm 1 câu về thói quen thường ngày để so sánh.",n:"4–5 câu",h:"Kết hợp hiện tại tiếp diễn với 1 câu hiện tại đơn (usually...).",
m:`Right now I'm sitting in a café near my house. The barista is making coffee and two students are studying at the next table. Outside, it's raining a little. I usually work at home, but today I'm working here because I need a change.`}});

L.push({id:3,lv:"A2",vi:"Thì quá khứ đơn",en:"Past Simple",
th:`<p>Dùng cho hành động <b>đã xảy ra và kết thúc</b> tại một thời điểm xác định trong quá khứ.</p>
<ul><li>Động từ có quy tắc thêm <b>-ed</b> (worked, played). Động từ bất quy tắc phải học thuộc (go → went, buy → bought, see → saw).</li>
<li>Phủ định và câu hỏi dùng <b>did</b>, động từ chính trở về nguyên mẫu.</li>
<li>Dấu hiệu: yesterday, last week/month/year, ... ago, in 2020.</li></ul>`,
f:["(+) S + V-ed / V2","(−) S + didn't + V","(?) Did + S + V ?","Wh- + did + S + V ?"],
ex:[["I finished the video last night.","Tôi làm xong video tối qua."],["We didn't go out yesterday.","Hôm qua chúng tôi không ra ngoài."],["When did you start learning English?","Bạn bắt đầu học tiếng Anh khi nào?"]],
mi:[["I didn't went.","I didn't go.","Sau didn't dùng nguyên mẫu."],["Did you saw it?","Did you see it?","Sau Did dùng nguyên mẫu."],["I buyed a book.","I bought a book.","buy là bất quy tắc."]],
q:[["Hôm qua tôi làm việc đến 10 giờ tối.",["Yesterday I worked until 10 p.m.","Yesterday, I worked until 10 p.m.","I worked until 10 p.m. yesterday.","I worked until 10 pm yesterday.","Yesterday I worked until 10 pm.","I worked until ten p.m. yesterday.","Yesterday I worked until 10 o'clock at night.","I worked until 10 at night yesterday."],"worked"],
["Chúng tôi đã đi Đà Lạt vào tháng trước.",["We went to Da Lat last month.","We went to Dalat last month.","Last month we went to Da Lat.","Last month, we went to Da Lat."],"go → went"],
["Anh ấy không gọi cho tôi.",["He didn't call me.","He did not call me."],"didn't + V"],
["Bạn đã ăn tối ở đâu?",["Where did you have dinner?","Where did you eat dinner?"],"Where + did + S + V?"],
["Tôi mua chiếc máy đọc sách này hai năm trước.",["I bought this e-reader two years ago.","I bought this e-reader 2 years ago.","I bought this ereader two years ago."],"buy → bought; ... ago"]],
w:{p:"Kể về cuối tuần vừa rồi của bạn (5 câu).",n:"5 câu",h:"Dùng ít nhất 3 động từ bất quy tắc và 1 câu phủ định.",
m:`Last weekend was relaxing. On Saturday morning, I went to the market with my mother. In the afternoon, I watched a film and finished a short animation. I didn't work on Sunday. I met my friends for dinner and we talked for hours.`}});

L.push({id:4,lv:"A2",vi:"Thì quá khứ tiếp diễn",en:"Past Continuous + when / while",
th:`<p>Dùng cho hành động <b>đang diễn ra tại một thời điểm trong quá khứ</b>, hoặc <b>đang diễn ra thì bị một hành động khác xen vào</b>.</p>
<ul><li>Công thức: <b>was / were + V-ing</b>.</li>
<li>Hành động dài (nền) → quá khứ tiếp diễn; hành động ngắn xen vào → quá khứ đơn.</li>
<li><b>when</b> + hành động ngắn (quá khứ đơn); <b>while</b> + hành động dài (tiếp diễn).</li>
<li>Hai hành động song song: While A was ..., B was ....</li></ul>`,
f:["S + was/were + V-ing","When + S + V2, S + was/were + V-ing","While + S + was/were + V-ing, S + V2"],
ex:[["At 9 p.m. yesterday, I was editing a video.","Lúc 9 giờ tối qua, tôi đang dựng video."],["I was cooking when the phone rang.","Tôi đang nấu ăn thì điện thoại reo."],["While she was sleeping, I was working.","Trong khi cô ấy ngủ, tôi đang làm việc."]],
mi:[["When I was arriving, he left.","When I arrived, he was leaving / he left.","Hành động ngắn dùng quá khứ đơn."],["They was playing.","They were playing.","they → were."]],
q:[["Lúc 8 giờ tối qua, tôi đang làm video.",["At 8 p.m. last night, I was making a video.","At 8 pm last night, I was making a video.","I was making a video at 8 p.m. last night.","I was making a video at 8 pm last night.","At 8 o'clock last night, I was making a video.","At eight last night, I was making a video."],"was + V-ing"],
["Khi mẹ gọi, tôi đang tắm.",["When my mom called, I was taking a shower.","When my mother called, I was taking a shower.","I was taking a shower when my mom called.","I was taking a shower when my mother called.","When my mum called, I was taking a shower.","When my mom called, I was having a shower.","When my mother called, I was having a shower."],"called (ngắn) / was taking (dài)"],
["Trong khi tôi đang nấu ăn, em gái tôi đang học bài.",["While I was cooking, my sister was studying.","While I was cooking, my younger sister was studying.","While I was cooking, my little sister was studying.","My sister was studying while I was cooking."],"hai hành động song song"],
["Trời đang mưa khi chúng tôi rời khỏi nhà.",["It was raining when we left the house.","It was raining when we left home."],"was raining / left"],
["Bạn đang làm gì lúc mất điện?",["What were you doing when the power went out?","What were you doing when the power cut happened?","What were you doing when the electricity went out?"],"What were you doing ...?"]],
w:{p:"Kể một sự việc bất ngờ xảy ra khi bạn đang làm gì đó (5 câu).",n:"5 câu",h:"Ít nhất 1 câu với when và 1 câu với while.",
m:`Last month, I was working late in my room. It was raining heavily outside. While I was rendering a video, the power suddenly went out. I lost two hours of work. Since then, I always save my files every ten minutes.`}});

L.push({id:5,lv:"A2",vi:"Tương lai: will và be going to",en:"Future: will vs be going to",
th:`<p>Hai cách nói về tương lai với ý nghĩa khác nhau:</p>
<ul><li><b>be going to + V</b>: <b>kế hoạch, dự định</b> đã có từ trước; <b>dự đoán có căn cứ</b> (nhìn thấy dấu hiệu).</li>
<li><b>will + V</b>: <b>quyết định ngay lúc nói</b>; <b>lời hứa, đề nghị giúp đỡ</b>; <b>dự đoán theo ý kiến</b> (I think..., probably).</li>
<li>Phủ định: won't + V / am not going to + V.</li></ul>`,
f:["S + am/is/are going to + V","S + will / won't + V","I think + S + will + V","I don't think + S + will + V"],
ex:[["Look at those clouds. It's going to rain.","Nhìn mây kìa. Sắp mưa rồi."],["The phone's ringing. I'll get it.","Điện thoại reo. Để tôi nghe (quyết định ngay)."],["I'm going to start a YouTube channel.","Tôi định mở kênh YouTube (đã lên kế hoạch)."]],
mi:[["I will to call you.","I will call you.","Sau will không có to."],["I think he won't come.","I don't think he will come.","Người bản xứ thường phủ định ở think."]],
q:[["Trời nhiều mây quá. Sắp mưa rồi.",["It's very cloudy. It's going to rain.","It is very cloudy. It is going to rain.","It's so cloudy. It's going to rain."],"dự đoán có căn cứ → going to"],
["Tôi đã quyết định rồi: tôi sẽ học tiếng Anh mỗi ngày.",["I've decided: I'm going to study English every day.","I have decided: I am going to study English every day.","I've decided. I'm going to study English every day.","I have decided. I'm going to learn English every day.","I've decided: I'm going to learn English every day."],"dự định → going to"],
["Đừng lo, tôi sẽ giúp bạn.",["Don't worry, I will help you.","Don't worry, I'll help you.","Do not worry, I will help you."],"lời hứa → will"],
["Tôi nghĩ anh ấy sẽ không đến.",["I don't think he will come.","I don't think he'll come.","I do not think he will come."],"I don't think + will"],
["Bạn định làm gì vào mùa hè này?",["What are you going to do this summer?"],"What + are you going to ...?"]],
w:{p:"Viết về kế hoạch của bạn cho năm tới (5 câu).",n:"5 câu",h:"Dùng going to cho kế hoạch và will cho dự đoán (I think...).",
m:`Next year is going to be busy. I'm going to take more international clients. I'm also going to practise English writing every day on my e-reader. I think my income will grow. I hope I will finally travel to Japan.`}});

L.push({id:6,lv:"A2",vi:"So sánh hơn và so sánh nhất",en:"Comparatives & Superlatives",
th:`<ul><li>Tính từ ngắn (1 âm tiết, hoặc 2 âm tiết tận cùng -y): <b>adj-er than</b>, <b>the adj-est</b> (cheap → cheaper → the cheapest; easy → easier → the easiest).</li>
<li>Tính từ dài: <b>more adj than</b>, <b>the most adj</b>.</li>
<li>Bất quy tắc: good → better → the best; bad → worse → the worst; far → further.</li>
<li>So sánh bằng: <b>as adj as</b>; không bằng: <b>not as adj as</b>.</li>
<li>Càng... càng...: <b>The + so sánh hơn ..., the + so sánh hơn ...</b></li></ul>`,
f:["S + be + adj-er / more adj + than + N","S + be + the adj-est / the most adj","S + be + (not) as + adj + as + N","The + comparative + S + V, the + comparative + S + V"],
ex:[["Hanoi is colder than Saigon in winter.","Mùa đông Hà Nội lạnh hơn Sài Gòn."],["This is the most difficult lesson.","Đây là bài khó nhất."],["The earlier you start, the sooner you finish.","Bắt đầu càng sớm, xong càng sớm."]],
mi:[["more cheaper","cheaper","Không dùng more với -er."],["He is more good than me.","He is better than me.","good → better."],["the most big","the biggest","Tính từ ngắn dùng -est."]],
q:[["Máy đọc sách nhẹ hơn máy tính bảng.",["An e-reader is lighter than a tablet.","E-readers are lighter than tablets.","The e-reader is lighter than the tablet.","An ereader is lighter than a tablet."],"light → lighter"],
["Tiếng Anh khó hơn tôi nghĩ.",["English is more difficult than I thought.","English is harder than I thought."],"difficult → more difficult"],
["Đây là bộ phim hay nhất tôi từng xem.",["This is the best movie I have ever seen.","This is the best movie I've ever seen.","This is the best film I have ever seen.","This is the best film I've ever seen.","This is the best movie I've ever watched.","This is the best film I've ever watched.","This is the best movie I have ever watched."],"good → the best + have ever V3"],
["Thành phố này không đông đúc bằng Hà Nội.",["This city is not as crowded as Hanoi.","This city isn't as crowded as Hanoi.","This city is not as crowded as Ha Noi.","This city isn't as crowded as Ha Noi.","This city is less crowded than Hanoi."],"not as ... as"],
["Càng luyện tập nhiều, bạn viết càng tốt.",["The more you practice, the better you write.","The more you practise, the better you write.","The more you practice, the better you will write.","The more you practise, the better you'll write."],"The more ..., the better ..."]],
w:{p:"So sánh hai nơi bạn từng sống, hoặc hai thiết bị bạn dùng hằng ngày (5 câu).",n:"5 câu",h:"Dùng ít nhất 1 so sánh hơn, 1 so sánh nhất và 1 câu as ... as.",
m:`I use a tablet and an e-reader every day. The tablet is faster and more colourful than the e-reader. However, the e-reader is lighter and much better for my eyes. Its battery is not as weak as the tablet's; it lasts for weeks. For reading, the e-reader is the best device I have ever owned.`}});

L.push({id:7,lv:"A2",vi:"Hiện tại hoàn thành (trải nghiệm)",en:"Present Perfect: ever, never, just, already, yet",
th:`<p>Hiện tại hoàn thành nối quá khứ với hiện tại. Ở bài này ta dùng nó để nói về:</p>
<ul><li><b>Trải nghiệm</b> (không nói rõ khi nào): Have you <b>ever</b>...? I have <b>never</b>...</li>
<li>Việc <b>vừa mới</b> xảy ra: <b>just</b> (đứng giữa have và V3).</li>
<li><b>already</b> (rồi – câu khẳng định) và <b>yet</b> (chưa / chưa? – cuối câu phủ định và câu hỏi).</li>
<li>Công thức: <b>have / has + V3 (past participle)</b>. Lưu ý: been to = đã từng đến (và đã về).</li></ul>`,
f:["S + have/has + V3","Have/Has + S + ever + V3 ?","S + have/has + never + V3","S + have/has + just/already + V3","S + haven't/hasn't + V3 + yet"],
ex:[["I've never been to Europe.","Tôi chưa bao giờ đến châu Âu."],["She has just left.","Cô ấy vừa mới đi."],["Have you finished yet?","Bạn xong chưa?"]],
mi:[["Have you ever went there?","Have you ever been there?","Dùng V3, không dùng V2."],["I have seen him yesterday.","I saw him yesterday.","Có thời điểm xác định → quá khứ đơn."],["I didn't finish yet.","I haven't finished yet.","yet đi với hiện tại hoàn thành."]],
q:[["Bạn đã bao giờ đến Nhật chưa?",["Have you ever been to Japan?"],"Have you ever been to ...?"],
["Tôi chưa bao giờ ăn sầu riêng.",["I have never eaten durian.","I've never eaten durian.","I have never tried durian.","I've never tried durian."],"never + V3"],
["Cô ấy vừa mới hoàn thành dự án.",["She has just finished the project.","She's just finished the project.","She has just completed the project.","She's just completed the project."],"has just + V3"],
["Tôi đã gửi email rồi.",["I have already sent the email.","I've already sent the email.","I have sent the email already.","I've sent the email already."],"already + V3"],
["Họ vẫn chưa trả lời.",["They haven't replied yet.","They have not replied yet.","They haven't answered yet.","They have not answered yet.","They still haven't replied.","They still haven't answered.","They haven't responded yet."],"haven't + V3 + yet"]],
w:{p:"Viết 5 câu về những trải nghiệm bạn đã từng có và chưa từng có.",n:"5 câu",h:"Dùng ever, never, already, just, yet.",
m:`I have worked with clients from three countries. I have never been abroad, but I have already saved money for a trip. I have just finished a wedding animation for a couple in Australia. Have you ever made a video for a stranger's wedding? I haven't decided my next project yet.`}});

L.push({id:8,lv:"A2",vi:"Động từ khuyết thiếu cơ bản",en:"Modals: can, must, have to, should",
th:`<ul><li><b>can / can't</b>: khả năng, sự cho phép.</li>
<li><b>should / shouldn't</b>: lời khuyên.</li>
<li><b>must</b>: bắt buộc (do người nói thấy cần, hoặc nội quy). <b>mustn't</b>: <b>cấm</b>.</li>
<li><b>have to</b>: bắt buộc do hoàn cảnh/quy định bên ngoài. <b>don't have to</b>: <b>không cần</b> (khác hẳn mustn't!).</li>
<li>Sau động từ khuyết thiếu luôn là <b>động từ nguyên mẫu không to</b>.</li></ul>`,
f:["S + can/should/must + V","S + have to / has to + V","S + don't/doesn't have to + V (không cần)","S + mustn't + V (cấm)"],
ex:[["You should drink more water.","Bạn nên uống nhiều nước hơn."],["I have to finish this by Friday.","Tôi phải xong cái này trước thứ Sáu."],["You don't have to pay. It's free.","Bạn không cần trả tiền. Miễn phí mà."]],
mi:[["She can speaks English.","She can speak English.","Sau can là nguyên mẫu."],["You must to go.","You must go.","must không đi với to."],["You mustn't come early (ý: không cần).","You don't have to come early.","mustn't = cấm, không phải 'không cần'."]],
q:[["Bạn nên đi ngủ sớm hơn.",["You should go to bed earlier.","You should sleep earlier."],"should + V"],
["Tôi có thể nói một chút tiếng Anh.",["I can speak a little English.","I can speak English a little."],"can + V"],
["Chúng ta phải đội mũ bảo hiểm.",["We must wear a helmet.","We have to wear a helmet.","We must wear helmets.","We have to wear helmets."],"must / have to"],
["Bạn không cần phải đến sớm.",["You don't have to come early.","You do not have to come early.","You don't need to come early.","You needn't come early."],"don't have to = không cần"],
["Bạn không được hút thuốc ở đây.",["You mustn't smoke here.","You must not smoke here.","You can't smoke here.","You cannot smoke here."],"mustn't = cấm"]],
w:{p:"Viết 5 lời khuyên cho người mới bắt đầu học tiếng Anh.",n:"5 câu",h:"Dùng should, shouldn't, have to, don't have to, can.",
m:`You should practise a little every day. You don't have to study for hours. You shouldn't be afraid of mistakes. You can learn a lot from short videos and simple books. Most importantly, you have to be patient.`}});

L.push({id:9,lv:"A2",vi:"There is/are và từ chỉ số lượng",en:"There is / are + some, any, much, many, a few, a little",
th:`<ul><li><b>There is</b> + danh từ số ít / không đếm được; <b>There are</b> + danh từ số nhiều.</li>
<li><b>some</b>: câu khẳng định (và lời mời). <b>any</b>: câu phủ định và câu hỏi.</li>
<li><b>many / a few</b> + danh từ đếm được số nhiều. <b>much / a little</b> + danh từ không đếm được.</li>
<li><b>a lot of</b>: dùng cho cả hai loại, phổ biến trong câu khẳng định.</li>
<li>Hỏi số lượng: <b>How many</b> + N số nhiều? / <b>How much</b> + N không đếm được?</li></ul>`,
f:["There is + a/an/some + N (số ít/không đếm được)","There are + some/many/a lot of + N (số nhiều)","There isn't/aren't + any + N","How many + N + are there ...?"],
ex:[["There are a few cafés near my house.","Gần nhà tôi có vài quán cà phê."],["There isn't much time left.","Không còn nhiều thời gian."],["Is there any milk?","Còn sữa không?"]],
mi:[["There is many people.","There are many people.","people là số nhiều."],["I have much friends.","I have many friends / a lot of friends.","friends đếm được."],["There aren't some apples.","There aren't any apples.","Phủ định dùng any."]],
q:[["Có rất nhiều quán cà phê ở khu tôi sống.",["There are a lot of cafés in my neighborhood.","There are a lot of cafes in my neighborhood.","There are many cafés in my neighborhood.","There are many cafes in my neighbourhood.","There are a lot of coffee shops in my area.","There are lots of cafés in my neighbourhood.","There are a lot of coffee shops in my neighborhood.","There are many coffee shops in my area."],"There are + a lot of + N số nhiều"],
["Trong tủ lạnh không còn sữa.",["There isn't any milk in the fridge.","There is no milk in the fridge.","There's no milk in the fridge.","There is no milk left in the fridge.","There isn't any milk left in the fridge.","There's no milk left in the fridge."],"milk không đếm được → isn't any"],
["Tôi có một vài người bạn ở Úc.",["I have a few friends in Australia.","I've got a few friends in Australia."],"a few + N số nhiều"],
["Chúng tôi không có nhiều thời gian.",["We don't have much time.","We do not have much time.","We haven't got much time."],"much + không đếm được"],
["Có bao nhiêu người trong gia đình bạn?",["How many people are there in your family?"],"How many + N + are there"]],
w:{p:"Mô tả góc làm việc / phòng làm việc của bạn (5 câu).",n:"5 câu",h:"Dùng there is/are và ít nhất 3 từ chỉ số lượng khác nhau.",
m:`My workspace is small but comfortable. There is a big desk next to the window. There are two monitors and a few plants on it. There isn't much space for books, so I keep them on my e-reader. There are a lot of sticky notes on the wall with ideas for videos.`}});

L.push({id:10,lv:"A2",vi:"Liên từ nối câu cơ bản",en:"Linking: and, but, so, because, then",
th:`<p>Viết hay bắt đầu từ việc <b>nối các câu ngắn</b> thành câu dài hơn một cách logic.</p>
<ul><li><b>and</b>: thêm ý. <b>but</b>: đối lập. <b>or</b>: lựa chọn.</li>
<li><b>so</b>: kết quả (đứng trước kết quả). <b>because</b>: nguyên nhân (đứng trước nguyên nhân).</li>
<li>Trình tự: <b>First, ... Then, ... After that, ... Finally, ...</b></li>
<li>Thường có dấu phẩy trước <b>but</b> và <b>so</b> khi nối hai mệnh đề.</li></ul>`,
f:["Clause 1, but clause 2","Clause (nguyên nhân), so clause (kết quả)","Clause (kết quả) because clause (nguyên nhân)","First, ... Then, ... Finally, ..."],
ex:[["I was hungry, so I made some noodles.","Tôi đói nên tôi nấu mì."],["I stayed home because it was cold.","Tôi ở nhà vì trời lạnh."],["The video is short, but it took a week.","Video ngắn nhưng mất cả tuần."]],
mi:[["Because it rained, so we stayed home.","Because it rained, we stayed home. / It rained, so we stayed home.","Không dùng because và so cùng lúc."],["Although she is rich but she is unhappy.","Although she is rich, she is unhappy.","Không dùng although và but cùng lúc."]],
q:[["Hôm qua tôi mệt nhưng vẫn đi tập thể dục.",["I was tired yesterday, but I still went to the gym.","Yesterday I was tired, but I still went to the gym.","Yesterday, I was tired, but I still went to the gym.","I was tired yesterday, but I still exercised.","Yesterday I was tired, but I still exercised.","I was tired yesterday but I still went to the gym."],"..., but ..."],
["Hôm qua trời mưa nên chúng tôi ở nhà.",["It rained yesterday, so we stayed at home.","It rained yesterday, so we stayed home.","It was raining yesterday, so we stayed at home.","It was raining yesterday, so we stayed home.","Yesterday it rained, so we stayed at home.","Yesterday it rained, so we stayed home."],"..., so ..."],
["Tôi học tiếng Anh vì tôi muốn làm việc với khách hàng nước ngoài.",["I study English because I want to work with foreign clients.","I'm learning English because I want to work with foreign clients.","I am learning English because I want to work with foreign clients.","I learn English because I want to work with foreign clients.","I'm studying English because I want to work with foreign clients."],"because + nguyên nhân"],
["Đầu tiên tôi đánh răng, sau đó tôi ăn sáng.",["First I brush my teeth, then I have breakfast.","First, I brush my teeth, then I have breakfast.","First, I brush my teeth. Then I have breakfast.","First I brush my teeth, and then I have breakfast.","First, I brush my teeth, and then I eat breakfast.","First I brush my teeth, then I eat breakfast."],"First ..., then ..."],
["Cô ấy thông minh và rất chăm chỉ.",["She is smart and very hard-working.","She's smart and very hardworking.","She is intelligent and very hard-working.","She's intelligent and very hard-working.","She is smart and very hardworking.","She is clever and very hard-working."],"and"]],
w:{p:"Viết đoạn 5–6 câu giới thiệu bản thân và công việc của bạn.",n:"5–6 câu",h:"Dùng đủ and, but, so, because ít nhất mỗi từ 1 lần.",
m:`My name is Nam and I make animation videos for clients. I love this job because I can be creative every day. Most of my clients are in Vietnam, but I want to work with foreign clients too. My English is not very good, so I practise writing every morning. First, I learn a new structure. Then, I write a short paragraph on my e-reader.`}});
// ===== B1 =====
L.push({id:11,lv:"B1",vi:"Hiện tại hoàn thành vs Quá khứ đơn",en:"Present Perfect vs Past Simple + for / since",
th:`<p>Đây là cặp thì người Việt hay nhầm nhất.</p>
<ul><li><b>Quá khứ đơn</b>: việc đã xong, <b>có thời điểm cụ thể</b> (yesterday, in 2020, last week, ... ago). Câu hỏi <b>When...?</b> luôn dùng quá khứ đơn.</li>
<li><b>Hiện tại hoàn thành</b>: việc <b>bắt đầu trong quá khứ và kéo dài đến nay</b>, hoặc kết quả còn liên quan đến hiện tại; <b>không nêu thời điểm cụ thể</b>.</li>
<li><b>for</b> + khoảng thời gian (for 5 years, for a long time). <b>since</b> + mốc thời gian (since 2019, since I was a child).</li>
<li>Hỏi bao lâu: <b>How long have you + V3...?</b></li></ul>`,
f:["S + have/has + V3 + for + khoảng thời gian","S + have/has + V3 + since + mốc thời gian","How long + have/has + S + V3 ?","S + V2 + thời điểm cụ thể trong quá khứ"],
ex:[["I have known her for ten years.","Tôi quen cô ấy được 10 năm rồi (vẫn đang quen)."],["I met her in 2016.","Tôi gặp cô ấy năm 2016."],["He has lived in Saigon since 2020.","Anh ấy sống ở Sài Gòn từ năm 2020 (đến giờ)."]],
mi:[["I live here for five years.","I have lived here for five years.","Kéo dài đến nay → hiện tại hoàn thành."],["I have finished it yesterday.","I finished it yesterday.","Có yesterday → quá khứ đơn."],["since three years","for three years","Khoảng thời gian dùng for."]],
q:[["Tôi đã sống ở đây được 5 năm.",["I have lived here for five years.","I've lived here for five years.","I have lived here for 5 years.","I've lived here for 5 years.","I have been living here for five years.","I've been living here for five years.","I've been living here for 5 years."],"have lived + for"],
["Tôi chuyển đến đây năm 2021.",["I moved here in 2021."],"mốc cụ thể → quá khứ đơn"],
["Anh ấy đã làm việc cho công ty này từ năm 2019.",["He has worked for this company since 2019.","He's worked for this company since 2019.","He has been working for this company since 2019.","He's been working for this company since 2019.","He has worked at this company since 2019."],"has worked + since"],
["Bạn biết cô ấy bao lâu rồi?",["How long have you known her?"],"How long have you + V3"],
["Tôi đã xem bộ phim đó tuần trước, nhưng tôi chưa đọc cuốn sách.",["I watched that movie last week, but I haven't read the book.","I watched that film last week, but I haven't read the book.","I saw that movie last week, but I haven't read the book.","I saw that film last week, but I haven't read the book.","I watched that movie last week, but I have not read the book.","I watched the movie last week, but I haven't read the book.","I saw the film last week, but I haven't read the book yet.","I watched the movie last week, but I haven't read the book yet."],"last week → V2; chưa đọc → haven't + V3"]],
w:{p:"Kể về hành trình làm nghề của bạn: bắt đầu khi nào, đã làm được những gì cho đến nay.",n:"80–100 từ",h:"Quá khứ đơn cho các mốc (in 2020, three years ago); hiện tại hoàn thành cho kết quả đến nay (have made, since, for).",
m:`I started making animations in 2019, when I was still at university. At first, I made short clips for my friends for free. Two years later, I got my first paying client. Since then, I have worked on more than fifty projects, including product ads and wedding videos. I have used After Effects for five years, and I have recently started learning 3D. Last year, I opened a small studio with a friend. I have learned a lot, but I still have many skills to improve, especially my English.`}});

L.push({id:12,lv:"B1",vi:"Hiện tại hoàn thành tiếp diễn",en:"Present Perfect Continuous",
th:`<p>Nhấn mạnh <b>quá trình, sự liên tục</b> của hành động bắt đầu trong quá khứ và <b>vẫn đang tiếp tục</b> hoặc <b>vừa dừng và để lại dấu vết</b>.</p>
<ul><li>Công thức: <b>have / has been + V-ing</b>.</li>
<li>So sánh: <i>I've written three emails</i> (nhấn mạnh <b>kết quả</b>, số lượng) vs <i>I've been writing emails all morning</i> (nhấn mạnh <b>thời gian, quá trình</b>).</li>
<li>Dấu hiệu: for, since, all day, all morning, lately, recently, How long...?</li>
<li>Không dùng với động từ trạng thái (know, like, own...).</li></ul>`,
f:["S + have/has been + V-ing (+ for/since)","How long + have/has + S + been + V-ing ?","S + haven't/hasn't been + V-ing + lately"],
ex:[["I've been working on this video since Monday.","Tôi làm video này từ thứ Hai (vẫn chưa xong)."],["You look tired. Have you been running?","Trông bạn mệt thế. Bạn vừa chạy bộ à?"],["It's been snowing all night.","Tuyết rơi suốt đêm."]],
mi:[["I have been knowing him for years.","I have known him for years.","know là động từ trạng thái."],["I am waiting here for an hour.","I have been waiting here for an hour.","Kéo dài từ quá khứ đến nay."]],
q:[["Tôi đã học tiếng Anh suốt 3 tiếng rồi.",["I have been studying English for three hours.","I've been studying English for three hours.","I have been studying English for 3 hours.","I've been studying English for 3 hours.","I've been learning English for three hours.","I have been learning English for three hours."],"have been + V-ing + for"],
["Trời đã mưa suốt cả buổi sáng.",["It has been raining all morning.","It's been raining all morning.","It has been raining the whole morning."],"has been raining"],
["Sao mắt bạn đỏ thế? Bạn khóc à?",["Why are your eyes red? Have you been crying?","Why are your eyes so red? Have you been crying?"],"dấu vết còn lại → Have you been V-ing?"],
["Dạo gần đây tôi ngủ không ngon.",["I haven't been sleeping well lately.","I haven't been sleeping well recently.","I have not been sleeping well lately.","I haven't been sleeping well these days."],"haven't been + V-ing + lately"],
["Họ đã chờ bạn từ 7 giờ.",["They have been waiting for you since 7.","They've been waiting for you since 7.","They have been waiting for you since seven.","They've been waiting for you since 7 o'clock.","They have been waiting for you since seven o'clock.","They've been waiting for you since seven."],"have been waiting + since"]],
w:{p:"Viết về một dự án hoặc kỹ năng bạn đang theo đuổi: đã làm bao lâu, quá trình ra sao, đã đạt được gì.",n:"80–100 từ",h:"Kết hợp have been V-ing (quá trình) với have V3 (kết quả).",
m:`I have been working on a music video for a local band since last month. I have been drawing the characters by hand and animating them in After Effects. It has been a slow process because the band keeps changing the story. So far, I have finished about two minutes of animation. I have also been learning a new plugin for lighting effects, and it has made the scenes look much richer. I have been sleeping less lately, but I am proud of what I have done.`}});

L.push({id:13,lv:"B1",vi:"Quá khứ hoàn thành",en:"Past Perfect",
th:`<p>Dùng cho hành động xảy ra <b>trước một hành động/mốc khác trong quá khứ</b> ("quá khứ của quá khứ").</p>
<ul><li>Công thức: <b>had + V3</b> (cho mọi chủ ngữ).</li>
<li>Hành động xảy ra trước → had + V3; hành động xảy ra sau → quá khứ đơn.</li>
<li>Hay đi với: when, before, after, by the time, already, never ... before.</li>
<li>Khi đã có <b>before/after</b> làm rõ thứ tự, người bản xứ đôi khi dùng quá khứ đơn cho cả hai — nhưng khi viết, dùng had + V3 sẽ rõ ràng hơn.</li></ul>`,
f:["S + had + V3 + before + S + V2","When + S + V2, S + had (already) + V3","After + S + had + V3, S + V2","By the time + S + V2, S + had + V3"],
ex:[["When I got to the station, the train had left.","Khi tôi tới ga thì tàu đã chạy mất rồi."],["I had never flown before that trip.","Trước chuyến đi đó tôi chưa từng đi máy bay."],["By the time we arrived, they had eaten everything.","Lúc chúng tôi tới thì họ đã ăn hết rồi."]],
mi:[["When I arrived, the film already started.","When I arrived, the film had already started.","Phim bắt đầu trước → had + V3."],["She said she has lost her phone.","She said she had lost her phone.","Lùi thì sau động từ quá khứ."]],
q:[["Khi tôi đến, bộ phim đã bắt đầu rồi.",["When I arrived, the movie had already started.","When I arrived, the film had already started.","When I got there, the movie had already started.","When I got there, the film had already started.","The movie had already started when I arrived.","The film had already started when I arrived."],"had already + V3"],
["Tôi chưa từng thấy biển trước khi tôi 10 tuổi.",["I had never seen the sea before I was ten.","I had never seen the sea before I was 10.","I had never seen the sea until I was ten.","I had never seen the sea until I was 10.","I had never seen the ocean before I was ten."],"had never + V3 + before"],
["Cô ấy nhận ra rằng mình đã quên chìa khóa.",["She realized that she had forgotten her keys.","She realised that she had forgotten her keys.","She realized she had forgotten her keys.","She realised she had forgotten her keys.","She realized that she had forgotten her key.","She realised that she had forgotten her key."],"realized (sau) / had forgotten (trước)"],
["Sau khi họ ăn tối xong, họ đi dạo.",["After they had finished dinner, they went for a walk.","After they had eaten dinner, they went for a walk.","After they had had dinner, they went for a walk.","After they had finished dinner, they took a walk.","After they had finished their dinner, they went for a walk."],"After + had + V3, V2"],
["Khách hàng đã duyệt bản nháp trước khi tôi bắt đầu làm hoạt hình.",["The client had approved the draft before I started animating.","The client had approved the draft before I started the animation.","The client had approved the draft before I began animating.","The client had approved the draft before I started to animate."],"had approved (trước) / started (sau)"]],
w:{p:"Kể lại một lần bạn đến trễ hoặc lỡ mất một điều gì đó. Điều gì đã xảy ra trước khi bạn tới?",n:"~100 từ",h:"Dùng ít nhất 4 lần had + V3, kết hợp when / by the time / before.",
m:`Last year, I almost missed my cousin's wedding. I had worked all night on a video, so I overslept. When I woke up, my family had already left. I took a taxi, but by the time I reached the restaurant, the ceremony had finished. Everyone had sat down to eat. I felt terrible because I had promised to film the ceremony for them. Luckily, another guest had recorded it on his phone. After that day, I never accept work the night before an important event.`}});

L.push({id:14,lv:"B1",vi:"Used to / would / be used to",en:"used to, would, be / get used to",
th:`<ul><li><b>used to + V</b>: thói quen hoặc trạng thái <b>trong quá khứ, nay không còn</b>. Phủ định: <b>didn't use to</b>; câu hỏi: <b>Did you use to...?</b></li>
<li><b>would + V</b>: thói quen lặp lại trong quá khứ (chỉ với <b>hành động</b>, không dùng cho trạng thái như live, have, like).</li>
<li><b>be used to + V-ing / N</b>: <b>đã quen với</b>. <b>get used to + V-ing / N</b>: <b>dần quen với</b>.</li>
<li>Cẩn thận: <i>used to do</i> (từng làm) ≠ <i>be used to doing</i> (quen làm).</li></ul>`,
f:["S + used to + V","S + didn't use to + V","S + would + V (hành động lặp lại)","S + am/is/are used to + V-ing","S + get/got used to + V-ing"],
ex:[["I used to hate vegetables.","Tôi từng ghét rau (giờ hết rồi)."],["Every Tết, we would visit my grandparents.","Tết nào chúng tôi cũng về thăm ông bà."],["I'm used to working at night.","Tôi quen làm việc ban đêm rồi."]],
mi:[["I am used to wake up early.","I am used to waking up early.","be used to + V-ing."],["I didn't used to like it.","I didn't use to like it.","Sau didn't dùng use."],["I would live in Hue.","I used to live in Hue.","live là trạng thái → không dùng would."]],
q:[["Hồi nhỏ tôi từng sống ở quê.",["I used to live in the countryside when I was a child.","When I was a child, I used to live in the countryside.","I used to live in the countryside when I was little.","When I was little, I used to live in the countryside.","I used to live in the countryside when I was a kid.","When I was a kid, I used to live in the countryside.","I used to live in my hometown when I was a child."],"used to + V"],
["Anh ấy trước đây không thích rau.",["He didn't use to like vegetables.","He did not use to like vegetables.","He never used to like vegetables."],"didn't use to + V"],
["Mỗi mùa hè, bà tôi thường kể chuyện cho chúng tôi nghe.",["Every summer, my grandmother would tell us stories.","Every summer, my grandma would tell us stories.","Every summer, my grandmother used to tell us stories.","Every summer, my grandma used to tell us stories.","Every summer my grandmother would tell us stories."],"would / used to + V"],
["Tôi đã quen với việc dậy sớm.",["I am used to getting up early.","I'm used to getting up early.","I am used to waking up early.","I'm used to waking up early.","I have got used to getting up early.","I've got used to getting up early.","I've gotten used to getting up early."],"be used to + V-ing"],
["Bạn có từng chơi nhạc cụ nào không?",["Did you use to play any musical instruments?","Did you use to play a musical instrument?","Did you use to play an instrument?","Did you use to play any instruments?"],"Did you use to + V?"]],
w:{p:"So sánh cuộc sống của bạn trước đây và bây giờ (thói quen, nơi sống, công việc).",n:"~100 từ",h:"Dùng used to, didn't use to, would và be/get used to.",
m:`Ten years ago, my life was very different. I used to live with my parents in a small town. Every evening, my father would take me to the river to fish. I didn't use to care about my career; I just played games. Now I live alone in the city and work as a freelance animator. At first, it was hard to get used to the noise and traffic. Now I'm used to working late and cooking for myself. I sometimes miss my old life, but I like who I have become.`}});

L.push({id:15,lv:"B1",vi:"Câu điều kiện loại 1",en:"First Conditional + unless, as soon as, when",
th:`<p>Nói về điều <b>có thể xảy ra</b> ở hiện tại/tương lai và kết quả của nó.</p>
<ul><li>Mệnh đề <b>if</b> dùng <b>hiện tại đơn</b> (KHÔNG dùng will), mệnh đề chính dùng <b>will / can / may / mệnh lệnh</b>.</li>
<li><b>unless</b> = if ... not (trừ khi).</li>
<li>Tương tự, sau <b>when, as soon as, before, after, until</b> nói về tương lai cũng dùng <b>hiện tại đơn</b>.</li>
<li>Đảo vị trí được: <i>We'll stay home if it rains.</i> (không cần dấu phẩy).</li></ul>`,
f:["If + S + V(s/es), S + will/can + V","Unless + S + V(s/es), S + will + V","S + will + V + as soon as/when + S + V(s/es)"],
ex:[["If you send me the script, I'll start tomorrow.","Nếu bạn gửi kịch bản, mai tôi sẽ bắt đầu."],["Unless you hurry, you'll be late.","Trừ khi bạn nhanh lên, không thì bạn sẽ trễ."],["I'll text you when I get home.","Về đến nhà tôi sẽ nhắn bạn."]],
mi:[["If it will rain, we will stay home.","If it rains, we will stay home.","Mệnh đề if không dùng will."],["Unless you don't study, you will fail.","Unless you study, you will fail.","unless đã mang nghĩa phủ định."],["I'll call you when I will arrive.","I'll call you when I arrive.","Sau when dùng hiện tại đơn."]],
q:[["Nếu trời mưa, chúng ta sẽ ở nhà.",["If it rains, we will stay at home.","If it rains, we'll stay at home.","If it rains, we will stay home.","If it rains, we'll stay home.","We will stay at home if it rains.","We'll stay home if it rains."],"If + hiện tại đơn, will + V"],
["Nếu bạn luyện viết mỗi ngày, bạn sẽ tiến bộ nhanh.",["If you practise writing every day, you will improve quickly.","If you practice writing every day, you will improve quickly.","If you practise writing every day, you'll improve quickly.","If you practice writing every day, you'll improve quickly.","If you practice writing every day, you will improve fast.","If you practise writing every day, you will make progress quickly.","If you practice writing every day, you'll make fast progress."],"If + V, will + V"],
["Trừ khi bạn nhanh lên, bạn sẽ lỡ chuyến tàu.",["Unless you hurry up, you will miss the train.","Unless you hurry up, you'll miss the train.","Unless you hurry, you will miss the train.","Unless you hurry, you'll miss the train."],"Unless + V"],
["Tôi sẽ gọi cho bạn ngay khi tôi đến nơi.",["I will call you as soon as I arrive.","I'll call you as soon as I arrive.","I will call you as soon as I get there.","I'll call you as soon as I get there."],"as soon as + hiện tại đơn"],
["Nếu khách hàng không thích, tôi sẽ sửa lại.",["If the client doesn't like it, I will revise it.","If the client doesn't like it, I'll revise it.","If the client does not like it, I will revise it.","If the client doesn't like it, I will edit it.","If the client doesn't like it, I'll fix it.","If the client doesn't like it, I will change it.","If the client doesn't like it, I'll change it.","If the client doesn't like it, I'll redo it."],"doesn't like / will + V"]],
w:{p:"Viết một email ngắn gửi khách hàng, nêu các điều kiện của dự án (thời hạn, số lần sửa, thanh toán...).",n:"~100 từ",h:"Dùng ít nhất 3 câu if, 1 câu unless, 1 câu as soon as.",
m:`Dear Ms. Linh,
Thank you for choosing our studio. If you approve the storyboard by Friday, we will deliver the first draft on 20 March. The price includes two rounds of revisions. If you need more changes, we will charge a small extra fee. Unless we receive the 50% deposit, we cannot book the animators for your project. As soon as the payment arrives, I will send you the production schedule. If you have any questions, please let me know.
Best regards,
Nam`}});

L.push({id:16,lv:"B1",vi:"Câu điều kiện loại 2",en:"Second Conditional",
th:`<p>Nói về điều <b>không có thật / khó xảy ra ở hiện tại hoặc tương lai</b> (giả định, tưởng tượng).</p>
<ul><li>Mệnh đề if dùng <b>quá khứ đơn</b>; mệnh đề chính dùng <b>would / could / might + V</b>.</li>
<li>Với to be, văn viết chuẩn dùng <b>were</b> cho mọi ngôi: <i>If I were you...</i> (dùng để khuyên).</li>
<li>Phân biệt: loại 1 = có khả năng thật (<i>If I have time, I'll call</i>); loại 2 = giả định (<i>If I had time, I'd call</i> – nhưng tôi không có thời gian).</li></ul>`,
f:["If + S + V2/were, S + would/could + V","If I were you, I would + V","What would you do if + S + V2 ?"],
ex:[["If I had a car, I would drive to work.","Nếu tôi có xe hơi, tôi sẽ lái đi làm (nhưng tôi không có)."],["If I were you, I'd ask for a higher price.","Nếu là bạn, tôi sẽ đòi giá cao hơn."],["She could travel more if she didn't work so much.","Cô ấy có thể đi du lịch nhiều hơn nếu không làm việc nhiều như vậy."]],
mi:[["If I would have money, I would buy it.","If I had money, I would buy it.","Mệnh đề if không dùng would."],["If I am you, I will...","If I were you, I would...","Giả định → loại 2."]],
q:[["Nếu tôi có nhiều thời gian hơn, tôi sẽ đọc nhiều sách hơn.",["If I had more time, I would read more books.","If I had more time, I'd read more books.","I would read more books if I had more time.","I'd read more books if I had more time."],"If + V2, would + V"],
["Nếu tôi là bạn, tôi sẽ nhận công việc đó.",["If I were you, I would take that job.","If I were you, I'd take that job.","If I were you, I would accept that job.","If I were you, I'd accept that job.","If I were you, I would take the job.","If I were you, I'd take the job.","If I were you, I would accept the job."],"If I were you"],
["Bạn sẽ làm gì nếu bạn trúng xổ số?",["What would you do if you won the lottery?"],"What would you do if + V2"],
["Nếu anh ấy nói tiếng Anh tốt, anh ấy có thể làm việc ở nước ngoài.",["If he spoke English well, he could work abroad.","If he spoke good English, he could work abroad.","If he spoke English well, he would be able to work abroad.","He could work abroad if he spoke English well."],"If + V2, could + V"],
["Tôi sẽ không làm vậy nếu tôi không chắc chắn.",["I wouldn't do that if I weren't sure.","I wouldn't do that if I wasn't sure.","I would not do that if I were not sure.","I wouldn't do that if I were not sure.","I would not do that if I was not sure."],"wouldn't + V / if + weren't"]],
w:{p:"Nếu bạn có thể sống ở bất kỳ đâu trên thế giới, bạn sẽ chọn nơi nào và cuộc sống của bạn sẽ ra sao?",n:"100–120 từ",h:"Dùng ít nhất 4 câu điều kiện loại 2, có 1 câu với could hoặc might.",
m:`If I could live anywhere in the world, I would choose Kyoto in Japan. I have always loved Japanese animation, so if I lived there, I would try to work for a small anime studio. I would rent a tiny apartment near the river and cycle to work every day. If I spoke Japanese, I could make friends with local artists and learn their techniques. Of course, life would not be perfect. If I moved so far away, I would miss my family and Vietnamese food. However, if I had the chance, I would definitely try it for at least one year.`}});

L.push({id:17,lv:"B1",vi:"Câu bị động cơ bản",en:"Passive Voice: present, past, present perfect",
th:`<p>Dùng bị động khi <b>hành động/đối tượng quan trọng hơn người làm</b>, hoặc không biết/không cần nói ai làm.</p>
<ul><li>Công thức chung: <b>be (chia theo thì) + V3</b>.</li>
<li>Hiện tại đơn: is/are + V3. Quá khứ đơn: was/were + V3. Hiện tại hoàn thành: has/have been + V3.</li>
<li>Muốn nhắc người làm: thêm <b>by + tác nhân</b> (chỉ khi thông tin đó quan trọng).</li>
<li>Bị động rất phổ biến khi <b>mô tả quy trình</b> và trong văn phong trang trọng.</li></ul>`,
f:["S + am/is/are + V3 (+ by ...)","S + was/were + V3","S + has/have been + V3"],
ex:[["Coffee is grown in the Central Highlands.","Cà phê được trồng ở Tây Nguyên."],["The video was made in two weeks.","Video được làm trong hai tuần."],["Your order has been shipped.","Đơn hàng của bạn đã được gửi đi."]],
mi:[["The house was build in 1990.","The house was built in 1990.","Dùng V3."],["It made in China.","It is made in China.","Thiếu to be."],["This book was written from Nguyen Du.","This book was written by Nguyen Du.","Tác nhân dùng by."]],
q:[["Tiếng Anh được nói ở nhiều quốc gia.",["English is spoken in many countries."],"is + V3"],
["Ngôi nhà này được xây năm 1990.",["This house was built in 1990."],"was + V3"],
["Video của tôi đã được xem hơn 10.000 lần.",["My video has been viewed more than 10,000 times.","My video has been watched more than 10,000 times.","My video has been viewed over 10,000 times.","My video has been watched over 10,000 times."],"has been + V3"],
["Bức thư được gửi đi hôm qua.",["The letter was sent yesterday."],"was + V3"],
["Những chiếc máy này được sản xuất ở Trung Quốc.",["These machines are made in China.","These machines are produced in China.","These machines are manufactured in China."],"are + V3"]],
w:{p:"Mô tả quy trình làm một video hoạt hình (hoặc một món ăn bạn biết nấu).",n:"100–120 từ",h:"Dùng ít nhất 6 câu bị động và các từ chỉ trình tự (first, then, after that, finally).",
m:`Making a short animated video involves several stages. First, a script is written and approved by the client. Then, a storyboard is drawn to show each scene. After that, the characters and backgrounds are designed, usually in Illustrator or Photoshop. Once the designs are approved, they are imported into After Effects and animated frame by frame. Meanwhile, the voice-over is recorded and music is chosen. Finally, sound effects are added, and the video is rendered and delivered. Nowadays, most of these files are shared online, so the whole project can be completed without a single meeting.`}});

L.push({id:18,lv:"B1",vi:"Mệnh đề quan hệ xác định",en:"Defining Relative Clauses: who, which, that, whose, where",
th:`<p>Mệnh đề quan hệ giúp gộp hai câu và <b>xác định rõ</b> ta đang nói về người/vật nào.</p>
<ul><li><b>who</b>: thay cho người. <b>which</b>: thay cho vật. <b>that</b>: thay cho cả người và vật (trong mệnh đề xác định).</li>
<li><b>whose + N</b>: chỉ sở hữu (người có ...). <b>where</b>: nơi mà. <b>when</b>: khi mà.</li>
<li>Khi đại từ quan hệ là <b>tân ngữ</b>, có thể <b>lược bỏ</b>: <i>the book (that) I bought</i>.</li>
<li>Không thêm đại từ thừa: <s>the man who I met him</s>.</li></ul>`,
f:["N (người) + who/that + V ...","N (vật) + which/that + V ...","N + (that) + S + V (tân ngữ – có thể bỏ that)","N + whose + N + V ...","N (nơi chốn) + where + S + V"],
ex:[["The designer who made this logo is only 19.","Người thiết kế làm logo này mới 19 tuổi."],["This is the software (that) I use every day.","Đây là phần mềm tôi dùng hằng ngày."],["I know a girl whose brother is an actor.","Tôi biết một cô gái có anh trai là diễn viên."]],
mi:[["The man which called you...","The man who called you...","Người dùng who."],["The book that I read it was good.","The book that I read was good.","Không lặp lại tân ngữ."],["The city which I was born","The city where I was born","Nơi chốn + mệnh đề đầy đủ → where."]],
q:[["Người phụ nữ sống cạnh nhà tôi là bác sĩ.",["The woman who lives next door to me is a doctor.","The woman who lives next door is a doctor.","The woman who lives next to me is a doctor.","The woman that lives next door is a doctor.","The woman that lives next door to me is a doctor.","The woman who lives next to my house is a doctor."],"who + V"],
["Đây là chiếc máy đọc sách mà tôi đã mua tháng trước.",["This is the e-reader that I bought last month.","This is the e-reader which I bought last month.","This is the e-reader I bought last month.","This is the ereader that I bought last month.","This is the ereader I bought last month."],"that/which (có thể bỏ)"],
["Tôi có một người bạn có bố là phi công.",["I have a friend whose father is a pilot.","I have a friend whose dad is a pilot.","I've got a friend whose father is a pilot."],"whose + N"],
["Đó là quán cà phê nơi chúng tôi gặp nhau lần đầu.",["That is the café where we first met.","That's the café where we first met.","That is the cafe where we first met.","That's the cafe where we first met.","That's the coffee shop where we first met.","That is the coffee shop where we first met.","That's the café where we met for the first time.","That's the cafe where we met for the first time."],"where + S + V"],
["Những học sinh luyện tập thường xuyên thì tiến bộ nhanh hơn.",["Students who practise regularly improve faster.","Students who practice regularly improve faster.","Students who practise regularly improve more quickly.","Students who practice regularly improve more quickly.","Students who practice regularly make faster progress.","Students that practise regularly improve faster.","Students who practise regularly make progress faster.","Students who practice regularly progress faster."],"who + V"]],
w:{p:"Giới thiệu một người quan trọng với bạn (thầy cô, bạn bè, đồng nghiệp...).",n:"100–120 từ",h:"Dùng ít nhất 3 mệnh đề quan hệ khác nhau (who, which/that, whose, where).",
m:`The person who has influenced me most is my first animation teacher, Mr. Hung. He is a quiet man whose drawings are full of energy. I met him at a small art centre where he taught evening classes for teenagers. The first thing that he taught us was to observe people on the street. He gave me an old sketchbook which I still keep on my desk. He always said that the students who make the most mistakes learn the fastest. Without him, I would never have chosen a career that I truly love.`}});

L.push({id:19,lv:"B1",vi:"Danh động từ và động từ nguyên mẫu",en:"Gerund (V-ing) vs Infinitive (to V)",
th:`<ul><li>Sau <b>enjoy, avoid, finish, keep, mind, suggest, practise, consider, give up</b> → <b>V-ing</b>.</li>
<li>Sau <b>want, decide, plan, hope, promise, agree, need, learn, refuse, afford</b> → <b>to V</b>.</li>
<li>Sau <b>giới từ</b> (in, at, of, about, without, before, after) → luôn <b>V-ing</b>: <i>interested in learning</i>.</li>
<li>Đổi nghĩa: <b>remember / forget / stop / try</b>:
<br>remember <b>to do</b> (nhớ để làm – chưa làm) vs remember <b>doing</b> (nhớ đã làm).
<br>stop <b>doing</b> (bỏ hẳn việc đó) vs stop <b>to do</b> (dừng lại để làm việc khác).</li>
<li>like / love / hate / start / begin: dùng được cả hai mà nghĩa gần như không đổi.</li></ul>`,
f:["enjoy / avoid / finish + V-ing","want / decide / plan + to V","giới từ + V-ing","remember / forget + to V (việc cần làm) | + V-ing (việc đã làm)"],
ex:[["I've finished editing the video.","Tôi dựng xong video rồi."],["She decided to move to Danang.","Cô ấy quyết định chuyển ra Đà Nẵng."],["I'm good at drawing but bad at writing.","Tôi giỏi vẽ nhưng kém viết."]],
mi:[["I enjoy to read.","I enjoy reading.","enjoy + V-ing."],["I'm interested in learn English.","I'm interested in learning English.","Sau giới từ dùng V-ing."],["I want going home.","I want to go home.","want + to V."]],
q:[["Tôi thích vẽ vào buổi tối.",["I enjoy drawing in the evening.","I enjoy drawing in the evenings.","I like drawing in the evening.","I like drawing in the evenings.","I like to draw in the evening.","I like to draw in the evenings.","I love drawing in the evening."],"enjoy/like + V-ing"],
["Anh ấy quyết định bỏ việc.",["He decided to quit his job.","He decided to leave his job.","He decided to quit."],"decide + to V"],
["Đừng quên khóa cửa nhé.",["Don't forget to lock the door.","Do not forget to lock the door."],"forget + to V (việc cần làm)"],
["Tôi nhớ là đã khóa cửa rồi.",["I remember locking the door.","I remember that I locked the door.","I remember I locked the door."],"remember + V-ing (việc đã làm)"],
["Cô ấy bỏ hút thuốc năm ngoái.",["She stopped smoking last year.","She quit smoking last year.","She gave up smoking last year."],"stop + V-ing"]],
w:{p:"Viết về những thói quen bạn muốn bỏ và những thói quen bạn muốn bắt đầu.",n:"100–120 từ",h:"Dùng ít nhất 6 cấu trúc: avoid, keep, stop, decide, plan, hope, enjoy, give up, be good at...",
m:`This year, I have decided to change some of my habits. First, I want to stop checking my phone in bed, because I keep waking up tired. I have also promised myself to avoid working after 11 p.m. Instead, I plan to read for thirty minutes before sleeping. I really enjoy reading on my e-reader, so this should not be difficult. Another goal is to practise writing in English every morning. I'm not very good at grammar, but I hope to improve by writing a little every day. Finally, I'm going to give up drinking soft drinks.`}});

L.push({id:20,lv:"B1",vi:"Câu tường thuật",en:"Reported Speech: said, told, asked",
th:`<p>Dùng để thuật lại lời người khác. Khi động từ tường thuật ở quá khứ (said, told, asked) → <b>lùi thì</b>:</p>
<ul><li>hiện tại → quá khứ; quá khứ / hiện tại hoàn thành → quá khứ hoàn thành; will → would; can → could.</li>
<li>Đổi đại từ và trạng từ: now → then, today → that day, tomorrow → the next day, here → there.</li>
<li><b>say</b> (something); <b>tell + người</b> (something): <i>He told me that...</i></li>
<li>Câu hỏi Yes/No: <b>asked + if/whether + S + V</b> (trật tự câu khẳng định). Câu hỏi Wh-: <b>asked + Wh- + S + V</b>.</li>
<li>Mệnh lệnh: <b>told / asked + O + (not) to V</b>.</li></ul>`,
f:["S + said (that) + S + V(lùi thì)","S + told + O + (that) + S + V(lùi thì)","S + asked + (O) + if/whether + S + V","S + asked + (O) + Wh- + S + V","S + told + O + (not) + to V"],
ex:[["\"I'm busy,\" he said. → He said (that) he was busy.","Anh ấy nói rằng anh ấy bận."],["\"Can you help me?\" → She asked me if I could help her.","Cô ấy hỏi tôi có thể giúp cô ấy không."],["\"Don't be late.\" → He told me not to be late.","Anh ấy dặn tôi đừng đến muộn."]],
mi:[["He said me that...","He told me that... / He said that...","tell + người; say không có người ngay sau."],["She asked me where did I live.","She asked me where I lived.","Trật tự câu khẳng định trong câu hỏi gián tiếp."]],
q:[["Cô ấy nói rằng cô ấy mệt.",["She said that she was tired.","She said she was tired."],"said + lùi thì"],
["Anh ấy nói với tôi rằng anh ấy sẽ gọi lại.",["He told me that he would call back.","He told me he would call back.","He told me that he would call me back.","He told me he would call me back.","He told me he'd call me back.","He told me he'd call back."],"told me + would"],
["Khách hàng hỏi tôi khi nào video sẽ xong.",["The client asked me when the video would be finished.","The client asked me when the video would be ready.","The client asked me when the video would be done.","The client asked when the video would be finished.","The client asked when the video would be ready.","The client asked me when the video would be completed."],"asked + when + S + V"],
["Mẹ dặn tôi đừng thức khuya.",["My mother told me not to stay up late.","My mom told me not to stay up late.","My mum told me not to stay up late.","My mother told me not to stay up too late.","My mom told me not to stay up too late."],"told + O + not to V"],
["Họ hỏi tôi có thích công việc này không.",["They asked me if I liked this job.","They asked me if I liked the job.","They asked me whether I liked this job.","They asked me whether I liked the job."],"asked + if/whether + S + V2"]],
w:{p:"Thuật lại một cuộc trò chuyện gần đây với khách hàng hoặc bạn bè.",n:"~120 từ",h:"Dùng said, told, asked; có câu hỏi Yes/No, câu hỏi Wh- và một mệnh lệnh được tường thuật.",
m:`Last Tuesday, a new client called me about a promotional video. She said that her company was opening a new café and needed a one-minute animation. She asked me how long the project would take. I told her that it would take about three weeks. Then she asked whether I could finish it in two weeks, because the opening had been moved forward. I explained that I would need extra help to do that. She told me not to worry about the budget and asked me to send her a quote that evening. I said I would, and we agreed to meet the next day.`}});
// ===== B2 =====
L.push({id:21,lv:"B2",vi:"Điều kiện loại 3 và hỗn hợp",en:"Third & Mixed Conditionals",
th:`<ul><li><b>Loại 3</b>: giả định <b>trái với quá khứ</b> (việc đã không xảy ra) → kết quả trong quá khứ.<br><b>If + had + V3, S + would have + V3</b>.</li>
<li><b>Hỗn hợp A</b>: điều kiện trái quá khứ → kết quả <b>ở hiện tại</b>.<br><b>If + had + V3, S + would + V (now)</b>.</li>
<li><b>Hỗn hợp B</b>: điều kiện trái hiện tại (tính cách, tình trạng lâu dài) → kết quả trong quá khứ.<br><b>If + V2/were, S + would have + V3</b>.</li>
<li>Thay thế cho mệnh đề if: <b>Without + N, ...</b> / <b>If it hadn't been for + N, ...</b></li></ul>`,
f:["If + S + had + V3, S + would/could have + V3","If + S + had + V3, S + would + V (now)","If + S + V2/were, S + would have + V3","Without / If it hadn't been for + N, S + would have + V3"],
ex:[["If I had saved the file, I wouldn't have lost my work.","Nếu tôi đã lưu file thì đã không mất bài."],["If I had taken that job, I would be living in Singapore now.","Nếu hồi đó nhận việc ấy, giờ tôi đang sống ở Singapore."],["If she weren't so shy, she would have spoken at the meeting.","Nếu cô ấy không nhút nhát thế thì đã phát biểu trong cuộc họp."]],
mi:[["If I would have known, I would have told you.","If I had known, I would have told you.","Mệnh đề if không dùng would."],["If I had studied, I would pass.","If I had studied, I would have passed.","Kết quả trong quá khứ → would have V3."]],
q:[["Nếu tôi dậy sớm hơn, tôi đã không lỡ chuyến bay.",["If I had got up earlier, I wouldn't have missed the flight.","If I had gotten up earlier, I wouldn't have missed the flight.","If I had woken up earlier, I wouldn't have missed the flight.","If I had got up earlier, I would not have missed the flight.","If I had woken up earlier, I would not have missed the flight.","If I had gotten up earlier, I would not have missed the flight.","If I'd got up earlier, I wouldn't have missed the flight.","If I'd woken up earlier, I wouldn't have missed the flight."],"If + had V3, wouldn't have V3"],
["Nếu bạn nói với tôi, tôi đã giúp bạn rồi.",["If you had told me, I would have helped you.","If you'd told me, I would have helped you.","If you had told me, I'd have helped you.","If you'd told me, I'd have helped you."],"Loại 3"],
["Nếu hồi đó tôi học tiếng Anh chăm hơn, bây giờ tôi đã nói trôi chảy rồi.",["If I had studied English harder back then, I would speak fluently now.","If I had studied English harder back then, I would be fluent now.","If I had studied English harder then, I would speak fluently now.","If I had studied English harder then, I would be fluent now.","If I had studied English harder in the past, I would speak fluently now.","If I had studied English harder in the past, I would be fluent now.","If I'd studied English harder back then, I'd be fluent now.","If I had worked harder at English back then, I would be fluent now."],"Hỗn hợp: had V3 → would V + now"],
["Nếu không có sự giúp đỡ của anh ấy, chúng tôi đã thất bại.",["Without his help, we would have failed.","If it hadn't been for his help, we would have failed.","If it had not been for his help, we would have failed.","Without his help, we would have failed.","If he hadn't helped us, we would have failed.","If he had not helped us, we would have failed."],"Without + N / If it hadn't been for"],
["Nếu tôi không bận như vậy, tôi đã đến bữa tiệc hôm qua.",["If I weren't so busy, I would have gone to the party yesterday.","If I wasn't so busy, I would have gone to the party yesterday.","If I weren't so busy, I would have come to the party yesterday.","If I wasn't so busy, I would have come to the party yesterday.","If I were not so busy, I would have gone to the party yesterday.","If I hadn't been so busy, I would have gone to the party yesterday.","If I hadn't been so busy, I would have come to the party yesterday."],"Hỗn hợp: were → would have V3 (hoặc loại 3)"]],
w:{p:"Một quyết định trong quá khứ đã thay đổi cuộc đời bạn. Điều gì sẽ khác nếu bạn đã chọn khác?",n:"~150 từ",h:"Dùng ít nhất 2 câu loại 3 và 2 câu hỗn hợp; 1 câu với Without / If it hadn't been for.",
m:`Five years ago, I had to choose between a stable office job and freelance animation. My parents wanted me to accept the office job, but I chose to work for myself. If I had listened to them, I would have had a regular salary from the start. I probably wouldn't have struggled so much during my first year. However, if I had taken that job, I would not be running my own studio today, and I wouldn't know half of the people I work with now. If I were a more cautious person, I would never have taken such a risk. Looking back, the hardest moment was when I almost ran out of money. If it hadn't been for a friend who recommended me to a big client, I would have given up. That experience taught me that the right decision is not always the safest one.`}});

L.push({id:22,lv:"B2",vi:"Bị động nâng cao và cấu trúc nhờ vả",en:"Advanced Passive & Causative (have / get something done)",
th:`<ul><li>Bị động với động từ khuyết thiếu: <b>modal + be + V3</b> (must be done, can be seen).</li>
<li>Bị động tiếp diễn: <b>is/was being + V3</b>. Bị động hoàn thành: <b>has been / had been / will have been + V3</b>.</li>
<li>Bị động quá khứ của modal: <b>should / could / must have been + V3</b>.</li>
<li><b>Cấu trúc nhờ vả</b> (thuê/nhờ người khác làm): <b>have / get + O (vật) + V3</b>: <i>I had my laptop repaired</i>.</li>
<li>Chủ động: <b>have + người + V</b> / <b>get + người + to V</b>: <i>I had the technician check it</i>.</li></ul>`,
f:["S + modal + be + V3","S + am/is/are/was/were + being + V3","S + should/could/must + have been + V3","S + have/get + O + V3 (nhờ, thuê)"],
ex:[["The files must be sent before noon.","Các file phải được gửi trước trưa."],["My office is being painted this week.","Tuần này văn phòng tôi đang được sơn."],["I'm getting my eyes tested tomorrow.","Mai tôi đi kiểm tra mắt."]],
mi:[["The project must finished.","The project must be finished.","Thiếu be."],["I cut my hair yesterday (ý: ra tiệm).","I had my hair cut yesterday.","Người khác làm → cấu trúc nhờ vả."],["The road is repairing.","The road is being repaired.","Bị động tiếp diễn."]],
q:[["Dự án phải được hoàn thành trước thứ Sáu.",["The project must be completed by Friday.","The project must be finished by Friday.","The project has to be completed by Friday.","The project has to be finished by Friday.","The project must be completed before Friday.","The project must be finished before Friday."],"must be + V3"],
["Cây cầu đang được sửa chữa.",["The bridge is being repaired.","The bridge is being fixed."],"is being + V3"],
["Tôi vừa đi cắt tóc.",["I have just had my hair cut.","I've just had my hair cut.","I just had my hair cut.","I just got my hair cut.","I've just got my hair cut.","I have just got my hair cut."],"have + O + V3"],
["Ngày mai chúng tôi sẽ mang máy tính đi sửa.",["We are going to have our computer repaired tomorrow.","We're going to have our computer repaired tomorrow.","We are having our computer repaired tomorrow.","We're having our computer repaired tomorrow.","We will have our computer repaired tomorrow.","We'll have our computer repaired tomorrow.","We're getting our computer repaired tomorrow.","We are going to get our computer fixed tomorrow.","We're going to get our computer fixed tomorrow.","We'll have the computer fixed tomorrow."],"have/get + O + V3"],
["Bản hợp đồng lẽ ra đã phải được ký từ tuần trước.",["The contract should have been signed last week.","The contract should have been signed a week ago."],"should have been + V3"]],
w:{p:"Viết một báo cáo tiến độ dự án gửi khách hàng bằng văn phong trang trọng.",n:"~150 từ",h:"Dùng ít nhất 5 dạng bị động khác nhau (hiện tại, tiếp diễn, hoàn thành, modal) và 1 câu nhờ vả.",
m:`Dear Mr. Tran,
I am writing to update you on the progress of your product video. The script has been finalised, and all character designs have been approved by your marketing team. At the moment, the first two scenes are being animated, and the background music is being composed by our sound designer. The voice-over will be recorded next Monday. Unfortunately, the third scene must be redesigned because the product colours were changed last week. This should have been communicated to us earlier, but the delay can be reduced if the new colour guide is sent by Wednesday. We are also having the subtitles translated into English by a professional translator. The final version is expected to be delivered on 15 May.
Kind regards,
Nam`}});

L.push({id:23,lv:"B2",vi:"Câu ước và If only",en:"wish / if only / would rather",
th:`<ul><li>Ước điều trái với <b>hiện tại</b>: <b>wish / if only + S + V2 (were)</b>: <i>I wish I had more time.</i></li>
<li>Ước điều trái với <b>quá khứ</b> (hối tiếc): <b>wish / if only + S + had + V3</b>: <i>I wish I hadn't said that.</i></li>
<li>Mong muốn ai/cái gì <b>thay đổi</b> (thường là phàn nàn): <b>wish + S + would + V</b>: <i>I wish he would stop talking.</i> (không dùng với chính mình: <s>I wish I would</s>).</li>
<li>Ước có khả năng: <b>wish + S + could + V</b>.</li>
<li><b>would rather + S + V2</b>: muốn người khác làm/không làm gì: <i>I'd rather you didn't smoke here.</i></li>
<li><b>If only</b> mang cảm xúc mạnh hơn wish.</li></ul>`,
f:["S + wish / If only + S + V2/were (hiện tại)","S + wish / If only + S + had + V3 (quá khứ)","S + wish + S + would + V (phàn nàn, mong thay đổi)","S + would rather + S + V2"],
ex:[["I wish I lived closer to the sea.","Ước gì tôi sống gần biển hơn."],["If only I had saved more money last year!","Giá mà năm ngoái tôi tiết kiệm nhiều hơn!"],["I wish my neighbours would turn their music down.","Ước gì hàng xóm vặn nhỏ nhạc xuống."]],
mi:[["I wish I can speak English.","I wish I could speak English.","Lùi một thì: can → could."],["I wish I didn't go there yesterday.","I wish I hadn't gone there yesterday.","Hối tiếc quá khứ → had V3."]],
q:[["Ước gì tôi nói tiếng Anh giỏi hơn.",["I wish I spoke English better.","I wish I could speak English better.","If only I spoke English better.","If only I could speak English better.","I wish I spoke better English.","I wish I could speak better English."],"wish + V2 / could"],
["Ước gì hôm qua tôi đã không nói điều đó.",["I wish I hadn't said that yesterday.","I wish I had not said that yesterday.","If only I hadn't said that yesterday.","If only I had not said that yesterday."],"wish + hadn't + V3"],
["Giá mà trời tạnh mưa.",["If only it would stop raining.","I wish it would stop raining.","If only it would stop raining!"],"wish/If only + would"],
["Tôi muốn bạn đừng gọi cho tôi muộn như vậy.",["I'd rather you didn't call me so late.","I would rather you didn't call me so late.","I'd rather you didn't call me that late.","I would rather you did not call me so late.","I wish you wouldn't call me so late.","I wish you would not call me so late."],"would rather + S + V2"],
["Ước gì tôi đã bắt đầu học sớm hơn.",["I wish I had started learning earlier.","I wish I had started studying earlier.","If only I had started learning earlier.","If only I had started studying earlier.","I wish I'd started learning earlier.","I wish I'd started studying earlier.","I wish I had started to learn earlier."],"wish + had + V3"]],
w:{p:"Viết về những điều bạn ước khác đi: ở hiện tại, trong quá khứ, và ở những người xung quanh.",n:"~150 từ",h:"Dùng cả 4 dạng: wish + V2, wish + had V3, wish + would, would rather.",
m:`Like most people, I have a few regrets and wishes. First of all, I wish I had more free time. I work almost every weekend, and I miss spending time with my family. I also wish I could draw faster, because some projects take far too long. When I look back, I wish I had learned English properly at school. If only I had paid attention in class, I would not have to study so hard now. I also wish I hadn't spent so much money on expensive equipment that I never use. As for other people, I wish some clients would read the brief carefully before asking for changes. And honestly, I would rather my friends didn't call me at midnight to ask for "a quick favour". Still, these are small problems, and I am grateful for what I have.`}});

L.push({id:24,lv:"B2",vi:"Động từ khuyết thiếu chỉ suy đoán",en:"Modals of Deduction: must, might, can't (+ have V3)",
th:`<p>Dùng để <b>suy đoán</b> dựa trên bằng chứng, với mức độ chắc chắn khác nhau.</p>
<ul><li><b>Hiện tại</b>: <b>must + V</b> (chắc chắn là ~90%), <b>might / may / could + V</b> (có thể ~50%), <b>can't + V</b> (chắc chắn không).</li>
<li><b>Quá khứ</b>: <b>must have + V3</b> (chắc hẳn đã), <b>might / may / could have + V3</b> (có lẽ đã), <b>can't / couldn't have + V3</b> (không thể nào đã).</li>
<li>Phê bình/tiếc nuối việc đã qua: <b>should have + V3</b> (lẽ ra nên), <b>shouldn't have + V3</b> (lẽ ra không nên).</li>
<li>Đang diễn ra: <b>must be + V-ing</b>: <i>He must be sleeping.</i></li></ul>`,
f:["S + must / might / can't + V (hiện tại)","S + must / might / can't + have + V3 (quá khứ)","S + should / shouldn't + have + V3"],
ex:[["The lights are off. They must be out.","Đèn tắt rồi. Chắc họ đi vắng."],["She might have missed the bus.","Có lẽ cô ấy đã lỡ xe buýt."],["He can't have finished already — he only started an hour ago.","Không thể nào anh ấy xong rồi — mới bắt đầu một tiếng trước."]],
mi:[["He mustn't be at home. (ý: chắc không)","He can't be at home.","Phủ định của suy đoán chắc chắn là can't."],["She must have forget.","She must have forgotten.","Sau have dùng V3."]],
q:[["Cô ấy chắc hẳn đang rất mệt.",["She must be very tired.","She must be really tired.","She must be exhausted."],"must + V"],
["Anh ấy không thể nào ở nhà được — tôi vừa thấy anh ấy ở văn phòng.",["He can't be at home — I've just seen him at the office.","He can't be at home. I've just seen him at the office.","He can't be at home; I just saw him at the office.","He can't be at home. I just saw him at the office.","He can't be at home, I've just seen him at the office.","He cannot be at home — I have just seen him at the office.","He can't be at home because I just saw him at the office.","He can't be home. I just saw him at the office."],"can't + V"],
["Chắc là họ đã quên cuộc hẹn.",["They must have forgotten the appointment.","They must have forgotten about the appointment.","They must have forgotten the meeting.","They must have forgotten about the meeting."],"must have + V3"],
["Có thể cô ấy đã không nhận được email của tôi.",["She might not have received my email.","She may not have received my email.","She might not have got my email.","She may not have got my email.","She might not have gotten my email.","Maybe she didn't receive my email."],"might not have + V3"],
["Lẽ ra bạn nên nói với tôi sớm hơn.",["You should have told me earlier.","You should have told me sooner."],"should have + V3"]],
w:{p:"Bạn về nhà và thấy cửa mở, đồ đạc lộn xộn, có dấu chân bùn trên sàn... Hãy suy đoán chuyện gì đã xảy ra.",n:"~150 từ",h:"Dùng must have, might/may/could have, can't have, should have ít nhất mỗi loại 1 lần.",
m:`When I got home last night, the front door was wide open and there were muddy footprints all over the floor. At first, I thought someone must have broken in. However, nothing seemed to be missing: my laptop was still on the desk, so it can't have been a burglar. Then I noticed that the footprints were very small and round. They must have been made by an animal. My neighbour's dog might have pushed the door open, because it often wanders around the building. It could also have been the wind, since the lock is old. Either way, I must have forgotten to lock the door when I left in a hurry. The mess in the kitchen suggested the dog had been looking for food. I should have checked the door twice, and I definitely shouldn't have left fried chicken on the table.`}});

L.push({id:25,lv:"B2",vi:"Tương lai tiếp diễn và tương lai hoàn thành",en:"Future Continuous & Future Perfect",
th:`<ul><li><b>Tương lai tiếp diễn</b> <b>will be + V-ing</b>: hành động <b>đang diễn ra tại một thời điểm trong tương lai</b> (This time tomorrow, At 9 p.m. tonight). Cũng dùng để <b>hỏi lịch trình một cách lịch sự</b>: <i>Will you be using the car tonight?</i></li>
