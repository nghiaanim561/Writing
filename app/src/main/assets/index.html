{"analysis":"2-3 câu bằng tiếng Việt nêu các lỗi lặp lại chính và cách khắc phục","items":[{"vi":"...","en":["..."],"hint":"...","lesson":<id of the most related lesson, 1-36, or 0>}]}
Lesson ids: ${L.map(l=>l.id+"="+l.en).join("; ")}`;
  try{const a=await askJSON(prompt,false,3000);const items=(a.items||[]).filter(x=>x&&x.vi&&Array.isArray(x.en)&&x.en.length);if(!items.length)throw {code:"parse"};
    S.weak=items.map(x=>[String(x.vi),x.en.map(String),String(x.hint||""),(+x.lesson||0)]);view.weakNote=a.analysis||"";save();view.weakBusy=false;startWeak()}
  catch(e){view.weakBusy=false;view.weakErr=aiErr(e)}
  renderReview();
}
function startWeak(){P={mode:"weak",items:S.weak.map((x,i)=>[x[3]||1,"w"+i]),i:0,phase:"input",res:null,draft:"",showF:false,showH:false}}

// ---------- settings ----------
let resetArm=false;
function renderSettings(){
  let h=hdr(`<button class="tiny" data-go="home">← Danh sách</button>`,"Cài đặt");
  h+=`<h2>API key Anthropic</h2><p class="small">Dùng để chấm bài và tạo bài tập bằng Claude. Key chỉ lưu trên máy này. Tạo key tại <b>console.anthropic.com</b> → API Keys.</p>
  <input id="key" type="${view.showKey?"text":"password"}" value="${esc(S.key||"")}" placeholder="sk-ant-..." autocomplete="off" style="width:100%;font:inherit;border:2px solid #000;border-radius:6px;padding:10px 12px;min-height:52px">
  <div class="row mt"><button data-a="savekey" style="flex:1" class="pri">Lưu key</button><button data-a="showkey" class="tiny">${view.showKey?"Ẩn":"Hiện"}</button><button data-a="testkey" ${hasKey()?"":"disabled"}>Kiểm tra</button></div>
  ${view.keyMsg?`<p class="small"><b>${esc(view.keyMsg)}</b></p>`:""}`;
  const opts=(cur)=>["claude-haiku-5-5|Haiku 5.5 (rẻ, nhanh)","claude-sonnet-5-5|Sonnet 5.5 (cân bằng)","claude-opus-5-5|Opus 5.5 (kỹ nhất, đắt)"].map(o=>{const [v,t]=o.split("|");return `<option value="${v}" ${v===cur?"selected":""}>${t}</option>`}).join("");
  const sel=`style="font:inherit;border:2px solid #000;border-radius:6px;padding:8px;min-height:52px;background:#fff;color:#000;width:100%"`;
  h+=`<h2 class="mt">Model</h2><p class="small">Chấm bài viết và tạo bài tập:</p><select id="mdl" ${sel}>${opts(S.mdl)}</select><p class="small mt">Chấm câu dịch (nhanh):</p><select id="mdlq" ${sel}>${opts(S.mdlq)}</select>`;
  h+=`<p class="small mt">Ước tính chi phí: chấm 1 câu dịch ≈ 20–50đ (Haiku), chấm 1 bài viết ≈ 300–800đ (Sonnet). Đã dùng trong app: ≈ ${(S.spent||0).toLocaleString("vi-VN")} điểm token.</p>`;
  h+=`<h2 class="mt">Cỡ chữ</h2><div class="row"><button data-a="fs-">A− Nhỏ hơn</button><span><b>${S.fs}px</b></span><button data-a="fs+">A+ Lớn hơn</button></div>`;
  h+=`<h2 class="mt">Sao lưu tiến độ</h2><p class="small">Sao chép đoạn mã dưới để lưu, hoặc dán mã đã lưu rồi bấm Khôi phục.</p><textarea id="bk" rows="3" spellcheck="false">${view.bk?esc(view.bk):""}</textarea><div class="row mt"><button data-a="export" style="flex:1">Xuất tiến độ</button><button data-a="import" style="flex:1">Khôi phục</button></div>${view.bkMsg?`<p class="small"><b>${esc(view.bkMsg)}</b></p>`:""}`;
  h+=`<h2 class="mt">Mẹo dùng trên Boox</h2><ul class="small"><li>Bật chế độ làm mới <b>Văn bản / Text</b> hoặc <b>HD</b> để chữ nét nhất.</li><li>Bàn phím Boox có chế độ <b>viết tay</b>: viết bằng bút, máy tự chuyển thành chữ.</li></ul>`;
  h+=`<h2 class="mt">Xoá tiến độ</h2><button data-a="reset">${resetArm?"Bấm lần nữa để xác nhận xoá":"Xoá toàn bộ tiến độ (giữ API key)"}</button>`;
  $app.innerHTML=h;bindInputs();
}
async function testKey(){
  view.keyMsg="Đang kiểm tra…";renderSettings();
  try{const t=await callClaude("Reply with exactly: OK",true,10);view.keyMsg=/OK/i.test(t)?"✓ Key hoạt động tốt.":"Key hoạt động, phản hồi: "+t.slice(0,40)}catch(e){view.keyMsg="✗ "+aiErr(e)}
  renderSettings();
}

// ---------- events ----------
function bindInputs(){
  const ta=document.getElementById("ans");if(ta){ta.addEventListener("input",()=>{P.draft=ta.value})}
  const wt=document.getElementById("wtext");if(wt){let t=null;wt.addEventListener("input",()=>{const l=L.find(x=>x.id===view.id);LS(l.id).w[view.wi||0]=wt.value;document.getElementById("wc").textContent=wc(wt.value)+" từ";clearTimeout(t);t=setTimeout(save,1200)})}
  const m1=document.getElementById("mdl");if(m1)m1.addEventListener("change",()=>{S.mdl=m1.value;save()});
  const m2=document.getElementById("mdlq");if(m2)m2.addEventListener("change",()=>{S.mdlq=m2.value;save()});
}
$app.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.go!==undefined){go(b.dataset.go);return}
  const l=view.id?L.find(x=>x.id===view.id):null;
  if(b.dataset.step){step=b.dataset.step;if(step!=="practice")P=null;view.showModel=false;renderLesson();scrollTop();return}
  if(b.dataset.set!==undefined){startSet(l,b.dataset.set);renderLesson();scrollTop();return}
  if(b.dataset.wi!==undefined){view.wi=+b.dataset.wi;view.showModel=false;view.wfErr=null;renderLesson();return}
  if(b.dataset.del!==undefined){S.mist.splice(+b.dataset.del,1);save();renderReview();return}
  const a=b.dataset.a;if(!a)return;
  switch(a){
    case "fs-":S.fs=Math.max(15,S.fs-1);applyFs();save();if(view.name==="settings")renderSettings();break;
    case "fs+":S.fs=Math.min(30,S.fs+1);applyFs();save();if(view.name==="settings")renderSettings();break;
    case "hint":P.showH=!P.showH;rerender();break;
    case "formula":P.showF=!P.showF;rerender();break;
    case "formulaW":document.getElementById("fw").classList.toggle("hide");break;
    case "exit":P=null;rerender();break;
    case "check":{const v=(document.getElementById("ans").value||"").trim();if(!v)return;P.draft=v;const {q}=getQ(P.items[P.i]);const nv=norm(v);const exact=q[1].some(x=>norm(x)===nv);P.res={a:v,exact};P.phase="result";if(exact)recordResult(true);rerender();scrollTop();break}
    case "markok":recordResult(true);rerender();break;
    case "markno":recordResult(false);rerender();break;
    case "ai1":aiSentence();break;
    case "retry":P.phase="input";P.res=null;rerender();break;
    case "pprev":if(P.i>0){P.i--;P.phase="input";P.res=null;P.draft="";P.showH=false;rerender()}break;
    case "pnext":
      if(P.i<P.items.length-1){P.i++;P.phase="input";P.res=null;P.draft="";P.showH=false;P.showF=false;rerender();scrollTop()}
      else if(P.mode==="lesson"){P=null;renderLesson();scrollTop()}
      else{P.i=P.items.length;renderReview()}
      break;
    case "gen":genExercises(l,false);break;
    case "genhard":genExercises(l,true);break;
    case "ai2":aiWrite(l);break;
    case "model":view.showModel=!view.showModel;renderLesson();break;
    case "model2":aiModel(l);break;
    case "finish":{const st=LS(l.id);st.done=true;save();step="done";renderLesson();scrollTop();break}
    case "redo":{S.les[l.id]={q:{},w:{},wf:{},done:false,gen:LS(l.id).gen};save();P=null;step="learn";renderLesson();break}
    case "revstart":{P={mode:"review",items:S.mist.slice(0,10).map(m=>[m.lid,m.qi]),i:0,phase:"input",res:null,draft:"",showF:false,showH:false};renderReview();break}
    case "weak":genWeak();break;
    case "weakgo":startWeak();renderReview();break;
    case "revexit":P=null;renderReview();break;
    case "savekey":{S.key=(document.getElementById("key").value||"").trim();save();view.keyMsg=S.key?"Đã lưu key.":"Đã xoá key.";renderSettings();break}
    case "showkey":view.showKey=!view.showKey;renderSettings();break;
    case "testkey":testKey();break;
    case "export":{const c=JSON.parse(JSON.stringify(S));delete c.key;view.bk=btoa(unescape(encodeURIComponent(JSON.stringify(c))));view.bkMsg="Đã xuất. Bôi đen ô trên, sao chép và lưu lại.";renderSettings();try{document.getElementById("bk").select()}catch(e){}break}
    case "import":{try{const t=(document.getElementById("bk").value||"").trim();const c=JSON.parse(decodeURIComponent(escape(atob(t))));if(!c||!c.les)throw 0;const key=S.key;S=Object.assign(blank(),c);S.key=key;save();applyFs();view.bkMsg="✓ Đã khôi phục tiến độ."}catch(e){view.bkMsg="✗ Mã không hợp lệ."}renderSettings();break}
    case "reset":if(!resetArm){resetArm=true;renderSettings()}else{const k=S.key,fs=S.fs,m=S.mdl,mq=S.mdlq;S=blank();S.key=k;S.fs=fs;S.mdl=m;S.mdlq=mq;resetArm=false;save();go("home")}break;
  }
});
route();
</script>
