<li><b>Tương lai hoàn thành</b> <b>will have + V3</b>: hành động <b>sẽ hoàn tất trước</b> một mốc tương lai. Dấu hiệu: <b>by</b> + mốc, <b>by the time</b> + hiện tại đơn, <b>by then</b>.</li>
<li><b>Tương lai hoàn thành tiếp diễn</b> <b>will have been + V-ing</b>: nhấn mạnh <b>khoảng thời gian</b> tính đến một mốc tương lai.</li></ul>`,
f:["S + will be + V-ing (+ this time tomorrow / at ... )","S + will have + V3 + by + mốc tương lai","By the time + S + V(s), S + will have + V3","By + mốc, S + will have been + V-ing + for ..."],
ex:[["At 10 a.m. tomorrow, I'll be presenting to the client.","10 giờ sáng mai, tôi sẽ đang thuyết trình với khách hàng."],["By Friday, we'll have finished the first draft.","Trước thứ Sáu, chúng tôi sẽ làm xong bản nháp đầu."],["By 2027, I'll have been working as an animator for ten years.","Đến năm 2027, tôi sẽ làm hoạt hình được mười năm."]],
mi:[["By next week I will finish.","By next week I will have finished.","by + mốc tương lai → will have V3."],["By the time you will arrive...","By the time you arrive...","Sau by the time dùng hiện tại đơn."]],
q:[["Giờ này ngày mai tôi sẽ đang bay tới Seoul.",["This time tomorrow, I will be flying to Seoul.","This time tomorrow, I'll be flying to Seoul.","This time tomorrow I will be flying to Seoul.","I will be flying to Seoul this time tomorrow.","I'll be flying to Seoul this time tomorrow."],"will be + V-ing"],
["Đến cuối năm nay, tôi sẽ hoàn thành 50 video.",["By the end of this year, I will have finished 50 videos.","By the end of this year, I'll have finished 50 videos.","By the end of this year, I will have completed 50 videos.","By the end of this year, I'll have completed 50 videos.","By the end of this year, I will have made 50 videos.","By the end of this year, I'll have made 50 videos.","By the end of the year, I will have finished 50 videos.","By the end of the year, I will have made fifty videos.","By the end of this year, I will have made fifty videos."],"By + mốc, will have + V3"],
["Đến lúc bạn tới, chúng tôi sẽ ăn xong rồi.",["By the time you arrive, we will have finished eating.","By the time you arrive, we'll have finished eating.","By the time you arrive, we will have eaten.","By the time you arrive, we'll have eaten.","By the time you get here, we will have finished eating.","By the time you get here, we'll have finished eating.","By the time you arrive, we will have finished dinner.","By the time you arrive, we'll have finished dinner.","By the time you get here, we'll have eaten."],"By the time + hiện tại đơn"],
["Tối nay bạn có dùng máy tính không? Tôi muốn mượn.",["Will you be using the computer tonight? I'd like to borrow it.","Will you be using the computer tonight? I would like to borrow it.","Will you be using the computer tonight? I want to borrow it.","Will you be using the computer this evening? I'd like to borrow it."],"Will you be + V-ing (hỏi lịch sự)"],
["Đến tháng 6, tôi sẽ học tiếng Anh được một năm.",["By June, I will have been learning English for a year.","By June, I'll have been learning English for a year.","By June, I will have been studying English for a year.","By June, I'll have been studying English for a year.","By June, I will have been learning English for one year.","By June, I will have been studying English for one year.","By June I'll have been learning English for a year."],"will have been + V-ing + for"]],
w:{p:"Bạn của 5 năm sau: khi ấy bạn sẽ đang làm gì, và sẽ đã đạt được những gì?",n:"~150 từ",h:"Dùng will be V-ing ít nhất 2 lần, will have V3 ít nhất 3 lần, và 1 câu will have been V-ing.",
m:`Five years from now, my life will look quite different. On a typical weekday morning, I won't be sitting alone in my bedroom anymore; I'll be working in a bright studio with a small team of animators. We will probably be producing explainer videos for international companies. By then, I will have saved enough money to rent a proper office, and I will have hired at least three full-time employees. I also hope that I will have completed my first short animated film and sent it to a few festivals. In terms of English, I will have been practising writing every day for five years, so I will have become confident enough to pitch to clients without preparing a script. On weekends, I will be travelling more, maybe exploring Japan or Korea for inspiration. Of course, plans change, but setting clear goals helps me stay focused.`}});

L.push({id:26,lv:"B2",vi:"Mệnh đề quan hệ không xác định và rút gọn",en:"Non-defining & Reduced Relative Clauses",
th:`<ul><li><b>Mệnh đề không xác định</b> chỉ <b>bổ sung thông tin</b> (bỏ đi câu vẫn đủ nghĩa). Luôn có <b>dấu phẩy</b>, <b>không dùng that</b>, không lược bỏ đại từ.</li>
<li><b>, which</b> có thể thay cho <b>cả mệnh đề phía trước</b>: <i>He was late, which annoyed me.</i></li>
<li><b>Rút gọn mệnh đề quan hệ</b>:
<br>chủ động → <b>V-ing</b>: <i>the man (who is) standing there</i>;
<br>bị động → <b>V3</b>: <i>videos (which are) made in AE</i>;
<br>sau the first / last / only → <b>to V</b>: <i>the first person to arrive</i>.</li>
<li><b>Đồng vị ngữ</b>: bỏ cả đại từ và be: <i>Hanoi, the capital of Vietnam, ...</i></li></ul>`,
f:["N, who/which + V ..., + V chính","Clause, which + V (bình luận cả mệnh đề)","N + V-ing ... (rút gọn chủ động)","N + V3 ... (rút gọn bị động)","the first/last/only + N + to V"],
ex:[["My laptop, which I bought in 2019, is still fast.","Laptop của tôi, mua năm 2019, vẫn còn nhanh."],["The girl sitting next to me is my cousin.","Cô gái ngồi cạnh tôi là em họ tôi."],["She was the only one to notice the mistake.","Cô ấy là người duy nhất nhận ra lỗi sai."]],
mi:[["My father, that is a doctor, ...","My father, who is a doctor, ...","Mệnh đề không xác định không dùng that."],["He failed the test which surprised everyone.","He failed the test, which surprised everyone.","Bình luận cả câu → cần dấu phẩy."]],
q:[["Hà Nội, thủ đô của Việt Nam, có hơn 8 triệu dân.",["Hanoi, the capital of Vietnam, has more than 8 million people.","Hanoi, the capital of Vietnam, has over 8 million people.","Hanoi, which is the capital of Vietnam, has more than 8 million people.","Hanoi, which is the capital of Vietnam, has over 8 million people.","Hanoi, the capital of Vietnam, has more than eight million people.","Hanoi, the capital of Vietnam, has a population of over 8 million.","Hanoi, the capital of Vietnam, has more than 8 million inhabitants.","Ha Noi, the capital of Vietnam, has more than 8 million people."],"đồng vị ngữ / , which is"],
["Mẹ tôi, người đã làm giáo viên 30 năm, vừa nghỉ hưu.",["My mother, who has been a teacher for 30 years, has just retired.","My mother, who was a teacher for 30 years, has just retired.","My mother, who worked as a teacher for 30 years, has just retired.","My mom, who has been a teacher for 30 years, has just retired.","My mother, who has been a teacher for thirty years, has just retired.","My mother, who taught for 30 years, has just retired.","My mom, who worked as a teacher for 30 years, just retired.","My mother, who had been a teacher for 30 years, has just retired."],"N, who + V, + V chính"],
["Anh ấy lại đến muộn, điều này khiến tôi rất bực.",["He was late again, which made me very annoyed.","He was late again, which annoyed me a lot.","He was late again, which really annoyed me.","He came late again, which made me very annoyed.","He arrived late again, which annoyed me a lot.","He was late again, which made me really angry.","He was late again, which made me very angry."],", which (cả mệnh đề)"],
["Người đàn ông đang đứng ở cửa là sếp của tôi.",["The man standing at the door is my boss.","The man who is standing at the door is my boss.","The man standing by the door is my boss.","The man who is standing by the door is my boss."],"rút gọn: V-ing"],
["Những video được làm bằng After Effects thường trông rất mượt.",["Videos made with After Effects often look very smooth.","Videos made in After Effects often look very smooth.","Videos made with After Effects usually look very smooth.","Videos made in After Effects usually look very smooth.","Videos which are made with After Effects often look very smooth.","Videos that are made in After Effects usually look very smooth."],"rút gọn: V3"]],
w:{p:"Giới thiệu thành phố hoặc quê hương của bạn cho khách du lịch nước ngoài.",n:"150–180 từ",h:"Dùng ít nhất 2 mệnh đề không xác định, 1 câu ', which' bình luận cả mệnh đề, 2 mệnh đề rút gọn (V-ing / V3) và 1 đồng vị ngữ.",
m:`If you are planning a trip to central Vietnam, you should not miss Hoi An, a small town famous for its yellow walls and silk lanterns. The Ancient Town, which was recognised by UNESCO in 1999, is best explored on foot or by bicycle. Walking along the Thu Bon River at night, you will see hundreds of lanterns floating on the water, which creates a truly magical atmosphere. Many of the old houses, built more than two hundred years ago, are still home to local families. My aunt, who has run a tailor shop there for decades, can make a suit in less than a day. Visitors looking for a quieter experience can rent a boat to the nearby villages, where farmers still grow vegetables in traditional ways. The best time to visit is from February to April, when the weather is warm but not too hot.`}});

L.push({id:27,lv:"B2",vi:"Mệnh đề phân từ",en:"Participle Clauses (V-ing / V3 / Having V3)",
th:`<p>Rút gọn mệnh đề trạng ngữ để câu văn <b>gọn và trang trọng</b> hơn. Điều kiện: <b>hai mệnh đề cùng chủ ngữ</b>.</p>
<ul><li><b>V-ing</b>: hành động chủ động, xảy ra đồng thời hoặc chỉ nguyên nhân: <i>Feeling hungry, I made a sandwich.</i></li>
<li><b>Having + V3</b>: hành động chủ động <b>xảy ra trước</b>: <i>Having finished my work, I went out.</i></li>
<li><b>V3</b>: nghĩa <b>bị động</b>: <i>Written in 1820, the poem is still popular.</i></li>
<li><b>Not + V-ing</b>: phủ định: <i>Not knowing the answer, she stayed silent.</i></li>
<li>Có thể giữ liên từ: <b>After / Before / While / When + V-ing</b>.</li>
<li>Lỗi nghiêm trọng: <b>chủ ngữ treo</b>: <s>Walking home, the rain started.</s> (mưa không đi bộ!).</li></ul>`,
f:["V-ing ..., S + V (cùng lúc / nguyên nhân)","Having + V3 ..., S + V (xảy ra trước)","V3 ..., S + V (bị động)","Not + V-ing ..., S + V","After / While + V-ing, S + V"],
ex:[["Having worked all night, she was exhausted.","Vì đã làm cả đêm, cô ấy kiệt sức."],["Made by hand, each lantern is unique.","Được làm thủ công, mỗi chiếc đèn lồng là độc nhất."],["Opening the email, I saw the client's feedback.","Mở email ra, tôi thấy phản hồi của khách."]],
mi:[["Finishing the work, the computer crashed.","After I finished the work, the computer crashed.","Chủ ngữ treo: máy tính không làm việc."],["Wrote in English, the book is easy.","Written in English, the book is easy.","Bị động dùng V3."]],
q:[["Sau khi hoàn thành bản nháp, tôi gửi nó cho khách hàng.",["Having finished the draft, I sent it to the client.","Having completed the draft, I sent it to the client.","After finishing the draft, I sent it to the client.","After completing the draft, I sent it to the client.","Having finished the draft, I sent it to my client."],"Having + V3"],
["Vì cảm thấy mệt, cô ấy đi ngủ sớm.",["Feeling tired, she went to bed early.","Feeling tired, she went to sleep early.","Feeling exhausted, she went to bed early."],"V-ing (nguyên nhân)"],
["Được viết bằng tiếng Anh đơn giản, cuốn sách rất dễ đọc.",["Written in simple English, the book is very easy to read.","Written in plain English, the book is very easy to read.","Written in simple English, this book is very easy to read.","Written in easy English, the book is very easy to read."],"V3 (bị động)"],
["Đang đi bộ trong công viên thì tôi gặp một người bạn cũ.",["Walking in the park, I met an old friend.","While walking in the park, I met an old friend.","Walking in the park, I ran into an old friend.","While walking in the park, I ran into an old friend.","Walking through the park, I met an old friend.","While I was walking in the park, I met an old friend."],"(While) V-ing"],
["Vì không biết phải làm gì, anh ấy gọi cho tôi.",["Not knowing what to do, he called me.","Not knowing what to do, he phoned me.","Not knowing what to do, he rang me.","Not knowing what to do, he gave me a call."],"Not + V-ing"]],
w:{p:"Kể lại một ngày làm việc bận rộn của bạn.",n:"150–180 từ",h:"Dùng ít nhất 4 mệnh đề phân từ: V-ing, Having V3, V3 và Not V-ing. Kiểm tra kỹ chủ ngữ treo!",
m:`Last Thursday was one of the busiest days of my career. Waking up at six, I immediately checked my inbox and found three urgent messages from a client in Australia. Having read them carefully, I realised that the whole ending of their video needed to be changed. Not wanting to waste any time, I skipped breakfast and started redrawing the final scene. Working without a break, I managed to finish the new version by noon. Exported in high resolution, the file was too large to send by email, so I uploaded it to a shared folder. While waiting for feedback, I quickly prepared a storyboard for another project. Encouraged by the client's positive reply, I spent the afternoon polishing the colours and sound. Exhausted but satisfied, I finally shut down my computer at nine in the evening. Looking back, I learned that staying calm is the best way to handle pressure.`}});

L.push({id:28,lv:"B2",vi:"Liên từ tương phản và nhượng bộ",en:"Contrast & Concession: although, despite, whereas, however",
th:`<ul><li><b>Although / Even though + S + V</b>: mặc dù (even though nhấn mạnh hơn). Không dùng kèm <s>but</s>.</li>
<li><b>Despite / In spite of + N / V-ing</b>: mặc dù. Muốn theo sau là mệnh đề: <b>despite the fact that + S + V</b>.</li>
<li><b>However, ...</b> / <b>Nevertheless, ...</b>: tuy nhiên — <b>bắt đầu câu mới</b> hoặc sau dấu chấm phẩy, có dấu phẩy theo sau.</li>
<li><b>whereas / while</b>: trong khi (so sánh hai sự vật đối lập).</li>
<li><b>No matter what/how/where</b> = <b>Whatever / However / Wherever</b>: dù ... đi nữa.</li>
<li><b>adj / adv + as + S + V</b> (trang trọng): <i>Tired as she was, she kept working.</i></li></ul>`,
f:["Although / Even though + S + V, S + V","Despite / In spite of + N / V-ing, S + V","S + V. However, S + V.","S + V, whereas + S + V","Whatever / No matter what + S + V, ..."],
ex:[["Although the budget was small, the video looked amazing.","Dù ngân sách nhỏ, video trông rất tuyệt."],["Despite feeling nervous, she gave a great presentation.","Dù hồi hộp, cô ấy thuyết trình rất tốt."],["I prefer 2D, whereas my partner loves 3D.","Tôi thích 2D, trong khi cộng sự của tôi mê 3D."]],
mi:[["Despite it was raining, ...","Despite the rain, ... / Although it was raining, ...","despite + N/V-ing, không + mệnh đề."],["Although he is rich, but he is unhappy.","Although he is rich, he is unhappy.","Không dùng although + but."],["The price is high, however the quality is good.","The price is high. However, the quality is good.","however không nối hai mệnh đề bằng dấu phẩy."]],
q:[["Mặc dù trời mưa, chúng tôi vẫn đi chơi.",["Although it was raining, we still went out.","Although it rained, we still went out.","Even though it was raining, we still went out.","Even though it rained, we still went out.","Despite the rain, we still went out.","In spite of the rain, we still went out.","Although it was raining, we went out.","Despite the rain, we went out."],"Although + S + V / Despite + N"],
["Mặc dù rất mệt, cô ấy vẫn làm việc đến nửa đêm.",["Despite being very tired, she worked until midnight.","Despite being very tired, she still worked until midnight.","In spite of being very tired, she worked until midnight.","In spite of being very tired, she still worked until midnight.","Although she was very tired, she worked until midnight.","Although she was very tired, she still worked until midnight.","Even though she was very tired, she kept working until midnight.","Although she was very tired, she kept working until midnight.","Despite being very tired, she kept working until midnight."],"Despite + V-ing"],
["Anh trai tôi thích thể thao, trong khi tôi thích đọc sách.",["My brother likes sports, whereas I like reading.","My brother likes sports, whereas I prefer reading.","My brother likes sport, whereas I like reading.","My brother likes sports, while I like reading.","My brother likes sports, while I prefer reading.","My brother loves sports, whereas I love reading.","My older brother likes sports, whereas I like reading."],"whereas / while"],
["Giá khá cao. Tuy nhiên, chất lượng rất tốt.",["The price is quite high. However, the quality is very good.","The price is rather high. However, the quality is very good.","The price is quite high. However, the quality is excellent.","The price is quite high; however, the quality is very good."],"However, ..."],
["Dù bạn có làm gì đi nữa, đừng bỏ cuộc.",["Whatever you do, don't give up.","No matter what you do, don't give up.","Whatever you do, do not give up.","No matter what you do, do not give up."],"Whatever / No matter what"]],
w:{p:"Viết đoạn văn về ưu và nhược điểm của nghề làm tự do (freelance).",n:"~180 từ",h:"Dùng ít nhất 4 từ nối tương phản khác nhau (although, despite, however, whereas, nevertheless...).",
m:`Working as a freelancer has both clear benefits and serious drawbacks. On the positive side, freelancers can choose their own projects and working hours. Whereas office workers must follow a fixed schedule, I can start work at ten and take a long lunch if I want. However, this freedom comes at a price. Although I earn more than many of my friends in some months, my income can drop sharply in others. Despite having several regular clients, I still worry about money during quiet periods. Freelancing can also be lonely. In an office, colleagues share ideas and solve problems together, while freelancers often work alone for days. Nevertheless, I have found ways to deal with these problems: I save a fixed part of my income every month, and I work in co-working spaces twice a week. Difficult as it is at times, freelancing has made me more disciplined and independent. Whatever challenges come next, I would not go back to a nine-to-five job.`}});

L.push({id:29,lv:"B2",vi:"Câu chẻ và cấu trúc nhấn mạnh",en:"Cleft Sentences: It is ... that / What ... is",
th:`<p>Câu chẻ giúp <b>nhấn mạnh</b> một thành phần trong câu — rất hữu ích khi viết luận và thuyết trình.</p>
<ul><li><b>It is / was + phần nhấn mạnh + that / who + phần còn lại</b>: <i>It was my sister who taught me to draw.</i></li>
<li><b>What + S + V + is / was + phần nhấn mạnh</b>: <i>What I need is a holiday.</i></li>
<li><b>The reason (why) ... is that ...</b> / <b>The thing that ... is ...</b> / <b>All I want is ...</b></li>
<li><b>It wasn't until + thời điểm/mệnh đề + that + S + V</b>: mãi đến khi... mới...</li>
<li>Trợ động từ nhấn mạnh: <b>do / does / did + V</b>: <i>I did send the email!</i></li></ul>`,
f:["It is/was + X + that/who + ...","What + S + V + is/was + X","The reason (why) + S + V + is that / is to V","It wasn't until + ... + that + S + V2","S + do/does/did + V (nhấn mạnh)"],
ex:[["It was the music that made the video special.","Chính âm nhạc làm video trở nên đặc biệt."],["What surprised me most was the deadline.","Điều làm tôi ngạc nhiên nhất là hạn chót."],["It wasn't until midnight that I finished.","Mãi đến nửa đêm tôi mới xong."]],
mi:[["What I need is that a break.","What I need is a break.","Không thêm that thừa."],["It was until 10 that he came.","It wasn't until 10 that he came.","Cấu trúc dùng dạng phủ định."]],
q:[["Chính chị gái tôi là người đã dạy tôi vẽ.",["It was my sister who taught me to draw.","It was my sister who taught me how to draw.","It was my older sister who taught me to draw.","It was my older sister who taught me how to draw.","It was my sister that taught me to draw.","It was my sister that taught me how to draw.","It was my elder sister who taught me to draw."],"It was + X + who"],
["Điều tôi cần bây giờ là một kỳ nghỉ.",["What I need now is a holiday.","What I need now is a vacation.","What I need right now is a holiday.","What I need right now is a vacation.","What I need now is a break.","What I need right now is a break."],"What + S + V + is"],
["Lý do tôi học tiếng Anh là để làm việc với khách hàng quốc tế.",["The reason why I study English is to work with international clients.","The reason I study English is to work with international clients.","The reason I'm learning English is to work with international clients.","The reason why I'm learning English is to work with international clients.","The reason I learn English is to work with international clients.","The reason why I learn English is to work with international clients.","The reason I am studying English is to work with international clients.","The reason why I study English is so that I can work with international clients.","The reason I'm studying English is to work with international clients."],"The reason (why) ... is to V"],
["Mãi đến khi về nhà, tôi mới nhận ra mình đã làm mất ví.",["It wasn't until I got home that I realised I had lost my wallet.","It wasn't until I got home that I realized I had lost my wallet.","It was not until I got home that I realised I had lost my wallet.","It was not until I got home that I realized I had lost my wallet.","It wasn't until I got home that I realized I'd lost my wallet.","It wasn't until I arrived home that I realised I had lost my wallet.","It wasn't until I got back home that I realized I had lost my wallet."],"It wasn't until ... that"],
["Điều khiến tôi ngạc nhiên là giá cả.",["What surprised me was the price.","What surprised me was the prices.","The thing that surprised me was the price."],"What + V + was"]],
w:{p:"Viết về điều quan trọng nhất bạn đã học được trong công việc.",n:"~180 từ",h:"Dùng ít nhất 4 câu chẻ khác nhau (It is ... that, What ... is, The reason ... is, It wasn't until ...) và 1 câu nhấn mạnh với do/did.",
m:`When people ask me what the most important lesson in my career has been, my answer is always the same. It is not technical skill that makes a project successful, but communication. In my first year as an animator, I believed that beautiful visuals were enough. What I didn't understand was that clients often have a picture in their heads that they cannot describe clearly. It wasn't until I lost a big client that I realised how serious this problem was. I had spent three weeks on a video, only to hear that it was "completely wrong". The reason it went wrong was that I had never asked enough questions at the beginning. Since then, what I always do is send a short list of questions and a rough sketch before starting any project. It does take extra time, but it saves days of revisions later. What I have learned is simple: listening carefully is the first step of every good animation.`}});

L.push({id:30,lv:"B2",vi:"Bị động khách quan và từ nối trang trọng",en:"Impersonal Passive (It is said that...) & Formal Linkers",
th:`<p>Dùng khi trình bày <b>ý kiến chung, tin đồn, quan điểm phổ biến</b> một cách khách quan — rất hay gặp trong bài luận và báo chí.</p>
<ul><li><b>It is + said / believed / thought / expected / reported + that + S + V</b>.</li>
<li><b>S + is said / believed ... + to V</b> (hiện tại/tương lai) hoặc <b>to have + V3</b> (quá khứ): <i>He is believed to have left.</i></li>
<li>Từ nối trang trọng: <b>Moreover / Furthermore / In addition</b> (thêm ý); <b>Therefore / As a result / Consequently</b> (kết quả); <b>On the other hand</b> (mặt khác); <b>In conclusion</b> (kết luận).</li>
<li>Các từ này thường đứng đầu câu, theo sau là dấu phẩy.</li></ul>`,
f:["It is said / believed / thought + that + S + V","S + is said / believed + to V","S + is said / believed + to have + V3","S + V. Moreover / Therefore / As a result, S + V."],
ex:[["It is believed that the temple was built in the 11th century.","Người ta tin rằng ngôi chùa được xây vào thế kỷ 11."],["Prices are expected to rise next year.","Giá cả được dự đoán sẽ tăng vào năm tới."],["The demand is growing. Therefore, we need more staff.","Nhu cầu đang tăng. Do đó, chúng tôi cần thêm nhân sự."]],
mi:[["People say that it is said...","It is said that... / People say that...","Chọn một cách."],["He is believed to leave last week.","He is believed to have left last week.","Việc trong quá khứ → to have V3."],["Moreover he is lazy.","Moreover, he is lazy.","Cần dấu phẩy sau từ nối."]],
q:[["Người ta nói rằng học ngoại ngữ giúp não khỏe mạnh hơn.",["It is said that learning a foreign language makes the brain healthier.","It is said that learning a foreign language keeps the brain healthy.","Learning a foreign language is said to make the brain healthier.","Learning a foreign language is said to keep the brain healthy.","It is said that learning a foreign language helps the brain stay healthy.","It's said that learning a foreign language makes the brain healthier.","It is said that learning foreign languages makes the brain healthier."],"It is said that ... / is said to V"],
["Người ta tin rằng anh ấy đã rời khỏi đất nước.",["He is believed to have left the country.","It is believed that he has left the country.","It is believed that he left the country.","It's believed that he has left the country."],"is believed to have V3"],
["Giá nhà được dự đoán sẽ tăng.",["House prices are expected to rise.","House prices are expected to increase.","It is expected that house prices will rise.","It is expected that house prices will increase.","House prices are predicted to rise.","It is predicted that house prices will rise.","House prices are forecast to rise."],"are expected to V"],
["Chi phí đã tăng. Do đó, chúng tôi phải tăng giá.",["Costs have increased. Therefore, we have to raise our prices.","Costs have increased. Therefore, we have to increase our prices.","Costs have risen. Therefore, we have to raise our prices.","Costs have gone up. Therefore, we have to raise our prices.","Costs have increased. As a result, we have to raise our prices.","Costs have increased. Therefore, we have to raise prices.","Costs have increased. Consequently, we have to raise our prices.","Costs have increased; therefore, we have to raise our prices.","Costs have risen. Therefore, we must raise our prices."],"Therefore, ..."],
["Người ta cho rằng mạng xã hội gây hại cho giới trẻ.",["Social media is thought to harm young people.","It is thought that social media harms young people.","It is thought that social media is harmful to young people.","Social media is believed to harm young people.","It is believed that social media harms young people.","Social media is considered harmful to young people.","Social media is thought to be harmful to young people.","It is thought that social media is bad for young people."],"is thought to V / It is thought that"]],
w:{p:"Viết đoạn văn nghị luận: \"Mạng xã hội có lợi hay có hại?\"",n:"180–200 từ",h:"Dùng ít nhất 3 câu bị động khách quan và 4 từ nối trang trọng khác nhau.",
m:`Social media has become an essential part of modern life, yet its impact remains controversial. On the one hand, it is widely believed that platforms such as Facebook and TikTok help people stay connected regardless of distance. Moreover, they offer small businesses and freelancers a cheap way to reach customers. Many artists, for example, are said to have found their first clients through Instagram. On the other hand, social media is thought to have serious negative effects, especially on teenagers. It has been reported that young people who spend more than three hours a day online are more likely to feel anxious and lonely. Furthermore, false information spreads extremely quickly, and it is often difficult to tell what is true. As a result, users may form opinions based on rumours rather than facts. In my view, social media itself is neither good nor bad; what matters is how it is used. Therefore, schools and families should teach young people to use it wisely. In conclusion, social media can be a powerful tool, provided that it is used with care.`}});
// ===== C1 =====
L.push({id:31,lv:"C1",vi:"Đảo ngữ phủ định",en:"Negative Inversion: Never have I..., Not only..., No sooner...",
th:`<p>Đặt trạng từ phủ định/hạn chế <b>lên đầu câu</b> rồi <b>đảo trợ động từ lên trước chủ ngữ</b> (như câu hỏi). Tạo hiệu ứng nhấn mạnh, trang trọng, giàu cảm xúc.</p>
<ul><li><b>Never / Rarely / Seldom / Little</b> + trợ động từ + S + V.</li>
<li><b>Not only</b> + trợ động từ + S + V, <b>but</b> + S + <b>also</b> + V.</li>
<li><b>No sooner</b> + had + S + V3 + <b>than</b> ... / <b>Hardly / Scarcely</b> + had + S + V3 + <b>when</b> ... (vừa mới... thì...).</li>
<li><b>Only when / Only after / Not until</b> + mệnh đề, + trợ động từ + S + V (đảo ở <b>mệnh đề thứ hai</b>).</li>
<li><b>Under no circumstances / On no account</b> + trợ động từ + S + V (tuyệt đối không).</li>
<li>Nếu câu gốc không có trợ động từ, mượn <b>do / does / did</b>.</li></ul>`,
f:["Never / Rarely / Seldom + aux + S + V","Not only + aux + S + V, but S also + V","No sooner + had + S + V3 + than + S + V2","Hardly + had + S + V3 + when + S + V2","Only when / Not until + S + V, aux + S + V"],
ex:[["Rarely have I worked with such a talented team.","Hiếm khi tôi được làm việc với một đội tài năng như vậy."],["Not only did she finish early, but she also fixed my mistakes.","Cô ấy không những xong sớm mà còn sửa lỗi giúp tôi."],["Only after the deadline did they send the files.","Mãi sau hạn chót họ mới gửi file."]],
mi:[["Never I have seen...","Never have I seen...","Phải đảo trợ động từ."],["Not only he is smart but also kind.","Not only is he smart, but he is also kind.","Đảo ở vế Not only."],["Only when he left I realised...","Only when he left did I realise...","Đảo ở mệnh đề chính, không phải mệnh đề when."]],
q:[["Tôi chưa bao giờ thấy cảnh đẹp như vậy.",["Never have I seen such a beautiful view.","Never have I seen such a beautiful sight.","Never have I seen such a beautiful scene.","Never have I seen such beautiful scenery.","Never before have I seen such a beautiful view."],"Never have I + V3"],
["Anh ấy không những đến muộn mà còn quên tài liệu.",["Not only did he arrive late, but he also forgot the documents.","Not only was he late, but he also forgot the documents.","Not only did he come late, but he also forgot the documents.","Not only did he arrive late, but he also forgot the materials.","Not only did he arrive late but he also forgot the documents.","Not only was he late, but he also forgot the papers."],"Not only did he ..., but he also ..."],
["Hiếm khi chúng tôi nhận được phản hồi tích cực như vậy.",["Rarely do we receive such positive feedback.","Seldom do we receive such positive feedback.","Rarely do we get such positive feedback.","Seldom do we get such positive feedback.","Rarely have we received such positive feedback.","Seldom have we received such positive feedback."],"Rarely do we + V"],
["Tôi vừa mới về đến nhà thì trời đổ mưa.",["No sooner had I got home than it started to rain.","No sooner had I got home than it started raining.","No sooner had I gotten home than it started to rain.","No sooner had I arrived home than it started to rain.","No sooner had I got home than it began to rain.","Hardly had I got home when it started to rain.","Hardly had I arrived home when it began to rain.","Scarcely had I got home when it started to rain.","No sooner had I arrived home than it began to rain.","Hardly had I got home when it started raining."],"No sooner had ... than / Hardly had ... when"],
["Chỉ đến khi mất việc, anh ấy mới hiểu giá trị của nó.",["Only when he lost his job did he understand its value.","Only when he lost his job did he realise its value.","Only when he lost his job did he realize its value.","Only after losing his job did he understand its value.","Only after he lost his job did he understand its value.","Not until he lost his job did he understand its value.","Not until he lost his job did he realise its value.","Only when he lost his job did he understand how valuable it was.","Only after losing his job did he realise its value."],"Only when ... did he + V"]],
w:{p:"Viết đoạn mở đầu thật ấn tượng cho một bài phát biểu hoặc bài luận về một trải nghiệm đáng nhớ.",n:"~200 từ",h:"Dùng ít nhất 3 cấu trúc đảo ngữ khác nhau. Đừng lạm dụng: đảo ngữ hiệu quả nhất khi xen kẽ với câu thường.",
m:`Never had I imagined that a single phone call could change the direction of my career. It was a rainy evening in 2022, and I was about to give up on freelancing altogether. No sooner had I closed my laptop than my phone rang. On the other end was a producer from Melbourne who had seen one of my short animations online. Not only did she want to hire me for a series of educational videos, but she also offered to pay twice my usual rate. Rarely in my life have I felt so excited and so terrified at the same time. My English was far from perfect, and I had never worked with a foreign team. Only after I had accepted the offer did I realise how much I would have to learn: contracts, time zones, and the art of writing clear emails. Under no circumstances, I told myself, would I let this opportunity slip away. Today, I would like to share what that project taught me about courage, preparation and the value of saying yes before you feel ready.`}});

L.push({id:32,lv:"C1",vi:"Đảo ngữ câu điều kiện",en:"Inverted Conditionals: Had I known..., Should you..., Were I...",
th:`<p>Bỏ <b>if</b> và đảo trợ động từ lên đầu — văn phong <b>trang trọng</b>, thường gặp trong email công việc, hợp đồng, bài luận.</p>
<ul><li>Loại 1: <b>Should + S + V</b>, ... (= If S happens to V): <i>Should you have any questions, please contact us.</i></li>
<li>Loại 2: <b>Were + S + to V / N / adj</b>, ...: <i>Were I the manager, I would change this.</i></li>
<li>Loại 3: <b>Had + S + V3</b>, ...: <i>Had I known, I would have come.</i></li>
<li>Phủ định: <b>Had I not ... / Were it not for ... / Had it not been for ...</b> (không viết tắt <s>Hadn't I</s>).</li></ul>`,
f:["Should + S + V, S + will / please + V","Were + S + (to V / N / adj), S + would + V","Had + S + (not) + V3, S + would have + V3","Were it not for + N, S + would + V","Had it not been for + N, S + would have + V3"],
ex:[["Should the shipment be delayed, we will inform you immediately.","Nếu lô hàng bị chậm, chúng tôi sẽ báo ngay."],["Were she to accept the offer, she would move to Singapore.","Nếu cô ấy nhận lời, cô ấy sẽ chuyển sang Singapore."],["Had we left earlier, we would have caught the train.","Nếu chúng tôi đi sớm hơn thì đã kịp tàu."]],
mi:[["Hadn't I known...","Had I not known...","Không viết tắt khi đảo ngữ phủ định."],["Should you will need help...","Should you need help...","Sau Should dùng nguyên mẫu."],["Were I know...","Were I to know... / If I knew...","Were + S + to V."]],
q:[["Nếu tôi biết trước, tôi đã không đến.",["Had I known, I wouldn't have come.","Had I known, I would not have come.","Had I known in advance, I wouldn't have come.","Had I known in advance, I would not have come.","Had I known beforehand, I wouldn't have come.","Had I known, I wouldn't have gone.","Had I known in advance, I wouldn't have gone.","Had I known earlier, I wouldn't have come."],"Had I + V3"],
["Nếu bạn có bất kỳ câu hỏi nào, vui lòng liên hệ với chúng tôi.",["Should you have any questions, please contact us.","Should you have any questions, please do not hesitate to contact us.","Should you have any questions, please don't hesitate to contact us.","Should you have any questions, please feel free to contact us.","Should you have any questions, please get in touch with us."],"Should you + V"],
["Nếu tôi là giám đốc, tôi sẽ thay đổi chính sách này.",["Were I the director, I would change this policy.","Were I the manager, I would change this policy.","Were I the director, I'd change this policy.","Were I the director, I would change this policy.","Were I to be the director, I would change this policy.","Were I the CEO, I would change this policy."],"Were I + N"],
["Nếu không có sự hỗ trợ của bạn, dự án đã không thành công.",["Had it not been for your support, the project would not have succeeded.","Had it not been for your support, the project wouldn't have succeeded.","Had it not been for your support, the project would not have been successful.","Without your support, the project would not have succeeded.","Without your support, the project wouldn't have succeeded.","Had it not been for your help, the project would not have succeeded."],"Had it not been for + N"],
["Nếu khách hàng hủy đơn, chúng tôi sẽ hoàn lại 50% tiền cọc.",["Should the client cancel the order, we will refund 50% of the deposit.","Should the client cancel the order, we will refund half of the deposit.","Should the client cancel, we will refund 50% of the deposit.","Should the customer cancel the order, we will refund 50% of the deposit.","Should the client cancel the order, we will return 50% of the deposit.","Should the client cancel the order, 50% of the deposit will be refunded."],"Should + S + V"]],
w:{p:"Viết email trang trọng gửi khách hàng, giải thích các điều khoản quan trọng của hợp đồng (thay đổi, hủy bỏ, chậm trễ, bản quyền).",n:"~200 từ",h:"Dùng ít nhất 4 câu đảo ngữ điều kiện (Should, Were, Had, Had it not been for / Were it not for).",
m:`Dear Ms. Nguyen,
Thank you for confirming your interest in our animation services. Before we proceed, I would like to clarify a few key terms of the contract.
Should you wish to make changes after the storyboard has been approved, each additional revision will be charged at 10% of the total fee. Should the project be cancelled after production has started, the deposit will not be refunded, as our team will already have reserved time for your video.
Regarding deadlines, we always aim to deliver on schedule. However, were any delay to be caused by late feedback or missing materials, the delivery date would be adjusted accordingly. On our previous project with your company, we were able to finish a week early. Had the final logo files not been sent so promptly, this would not have been possible, so we greatly appreciate your team's efficiency.
Finally, all rights to the finished video will be transferred to your company upon full payment. Were it not for this condition, we would be unable to protect our artists' work.
Should you have any further questions, please do not hesitate to contact me.
Kind regards,
Nam`}});

L.push({id:33,lv:"C1",vi:"Danh từ hóa và văn phong học thuật",en:"Nominalisation & Academic Style",
th:`<p>Văn viết học thuật/trang trọng có xu hướng <b>biến động từ, tính từ thành danh từ</b> để câu cô đọng, khách quan hơn.</p>
<ul><li>Động từ → danh từ: increase → <b>an increase in</b>; decide → <b>the decision to</b>; develop → <b>the development of</b>; fail → <b>the failure to</b>.</li>
<li>Tính từ → danh từ: important → <b>the importance of</b>; difficult → <b>difficulty in</b>; available → <b>the availability of</b>.</li>
<li>Mệnh đề dài → cụm danh từ: <i>Because prices rose rapidly...</i> → <b>Due to the rapid rise in prices, ...</b></li>
<li>Động từ hay dùng với danh từ hóa: <b>lead to, result in, cause, contribute to, have an impact on</b>.</li>
<li>Tránh I, you, cách nói thân mật (a lot of, get, really) trong văn học thuật.</li></ul>`,
f:["Due to / Because of + the + adj + N (nominalised), S + V","The + N (of ...) + led to / resulted in + N","The + N + of + N + has a(n) + adj + impact on + N","A lack of / An increase in / The growth of + N"],
ex:[["People are worried because unemployment is rising. → The rise in unemployment has caused widespread concern.","Tỷ lệ thất nghiệp tăng đã gây lo ngại rộng rãi."],["If we invest in education, ... → Investment in education leads to long-term growth.","Đầu tư vào giáo dục dẫn đến tăng trưởng dài hạn."]],
mi:[["The increase of prices","The increase in prices","increase/rise/fall + in."],["Lack sleep affects health.","Lack of sleep affects health.","lack (danh từ) + of."]],
q:[["Vì giá cả tăng nhanh, nhiều người không mua nổi nhà.",["Due to the rapid increase in prices, many people cannot afford a house.","Due to the rapid rise in prices, many people cannot afford a house.","Due to the rapid increase in prices, many people cannot afford to buy a house.","Due to the rapid rise in prices, many people cannot afford to buy a home.","Because of the rapid rise in prices, many people cannot afford a home.","Because of the rapid increase in prices, many people cannot afford a house.","Due to the rapid rise in prices, many people can't afford a house.","Due to rapidly rising prices, many people cannot afford a house.","Owing to the rapid increase in prices, many people cannot afford a home."],"Due to + the rapid increase in + N"],
["Chính phủ quyết định tăng thuế, điều này khiến người dân phản đối.",["The government's decision to raise taxes led to public opposition.","The government's decision to raise taxes caused public opposition.","The government's decision to increase taxes led to public opposition.","The government's decision to raise taxes provoked public opposition.","The government's decision to raise taxes resulted in public opposition.","The government's decision to increase taxes caused public protests.","The government's decision to raise taxes led to protests from the public."],"The government's decision to V + led to + N"],
["Sự phát triển của công nghệ đã thay đổi cách chúng ta làm việc.",["The development of technology has changed the way we work.","The development of technology has changed how we work.","Technological development has changed the way we work.","Technological development has transformed the way we work.","The development of technology has transformed the way we work.","The development of technology has changed the way people work."],"The development of + N"],
["Học sinh tham gia nhiều hơn thì kết quả học tập sẽ tốt hơn.",["Greater student participation leads to better academic results.","Greater student participation leads to better academic performance.","Increased student participation leads to better academic results.","Increased participation by students leads to better academic results.","Greater participation by students results in better academic results.","Increased student participation results in better academic performance.","More student participation leads to better academic results."],"Greater / Increased + N + leads to + N"],
["Việc thiếu ngủ ảnh hưởng nghiêm trọng đến sức khỏe.",["Lack of sleep seriously affects health.","A lack of sleep seriously affects health.","Lack of sleep has a serious impact on health.","A lack of sleep has a serious impact on health.","Lack of sleep has a serious effect on health.","A lack of sleep has a serious effect on health.","Lack of sleep seriously affects your health.","Sleep deprivation seriously affects health.","Lack of sleep seriously affects people's health."],"(A) lack of + N + has a serious impact on"]],
w:{p:"Viết đoạn văn học thuật về tác động của trí tuệ nhân tạo (AI) đối với ngành sáng tạo (thiết kế, hoạt hình, viết...).",n:"200–250 từ",h:"Dùng ít nhất 6 cụm danh từ hóa (the rise of, the replacement of, a reduction in, the ability to...). Tránh dùng I/you.",
m:`The rapid development of artificial intelligence has had a profound impact on the creative industries. The availability of image and video generation tools has led to a dramatic reduction in the time required to produce visual content. For small businesses, this represents a significant opportunity, since the cost of advertising materials has fallen considerably. However, the growing reliance on automated tools has also raised serious concerns among professionals. One major issue is the potential replacement of junior designers and animators, whose tasks are increasingly being performed by software. Another concern is the lack of clear regulation regarding copyright, as many AI systems have been trained on artists' work without their consent. The consequence of this uncertainty is a decline in trust between technology companies and creative communities. Nevertheless, the adoption of AI does not necessarily signal the end of human creativity. On the contrary, the most successful studios appear to be those that combine the efficiency of machines with the judgement and emotional understanding of human artists. The ability to direct, select and refine AI-generated material is therefore likely to become an essential skill. In conclusion, while the introduction of AI presents genuine risks, its overall effect will depend largely on the willingness of the industry to adapt and on the establishment of fair rules for its use.`}});

L.push({id:34,lv:"C1",vi:"Ngôn ngữ rào đón và bày tỏ quan điểm",en:"Hedging & Stance: It could be argued that..., tend to, to some extent",
th:`<p>Người viết giỏi không khẳng định tuyệt đối. <b>Ngôn ngữ rào đón (hedging)</b> giúp lập luận thận trọng, thuyết phục và học thuật hơn.</p>
<ul><li>Động từ: <b>tend to, appear to, seem to, suggest, indicate</b>.</li>
<li>Cấu trúc: <b>It could be argued that</b>, <b>It is widely accepted that</b>, <b>There is some evidence that</b>.</li>
<li>Trạng từ: <b>arguably, possibly, largely, generally, to some / a certain extent</b>.</li>
<li>Modal: <b>may, might, could</b> thay cho will / is.</li>
<li>Khẳng định mạnh (khi chắc chắn): <b>It is undeniable that</b>, <b>There is no doubt that</b>, <b>Clearly, ...</b></li>
<li>Bày tỏ quan điểm: <b>I would argue that</b>, <b>From my perspective</b>, <b>I am inclined to believe that</b>.</li></ul>`,
f:["It could be argued that + S + V","S + tend(s) to / appear(s) to + V","To some extent / To a certain extent, S + V","It is undeniable that / There is no denying that + S + V","There is some evidence to suggest that + S + V"],
ex:[["Remote workers tend to be more productive.","Người làm việc từ xa thường năng suất hơn."],["This may be partly due to the lack of training.","Điều này có thể một phần do thiếu đào tạo."],["It could be argued that exams do not measure real ability.","Có thể lập luận rằng thi cử không đo được năng lực thật."]],
mi:[["Young people always spend too much time online.","Young people tend to spend too much time online.","Tránh khái quát tuyệt đối."],["In some extent","To some extent","Giới từ to."]],
q:[["Có thể nói rằng công nghệ khiến con người cô đơn hơn.",["It could be argued that technology makes people lonelier.","It could be argued that technology makes people more lonely.","It can be argued that technology makes people lonelier.","It can be argued that technology makes people more lonely.","Arguably, technology makes people lonelier.","Arguably, technology makes people more lonely.","It could be argued that technology is making people lonelier.","It could be said that technology makes people lonelier."],"It could be argued that ..."],
["Người trẻ có xu hướng dành nhiều thời gian trên mạng hơn.",["Young people tend to spend more time online.","Young people tend to spend more time on the internet.","Young people tend to spend more time on the Internet.","Young people tend to spend more of their time online."],"tend to + V"],
["Dường như phương pháp này hiệu quả hơn.",["This method appears to be more effective.","This method seems to be more effective.","It seems that this method is more effective.","It appears that this method is more effective.","This approach appears to be more effective.","This method seems more effective.","It seems this method is more effective."],"appear to / seem to"],
["Ở một mức độ nào đó, tôi đồng ý với quan điểm này.",["To some extent, I agree with this view.","To a certain extent, I agree with this view.","To some extent, I agree with this opinion.","To a certain extent, I agree with this opinion.","To some extent, I agree with this point of view.","To some extent, I agree with this idea.","I agree with this view to some extent.","I agree with this view to a certain extent."],"To some extent"],
["Không thể phủ nhận rằng tiếng Anh là ngôn ngữ toàn cầu.",["It is undeniable that English is a global language.","There is no denying that English is a global language.","It cannot be denied that English is a global language.","It's undeniable that English is a global language.","Undeniably, English is a global language.","No one can deny that English is a global language."],"It is undeniable that / There is no denying that"]],
w:{p:"Bài luận thảo luận: \"Có còn cần học ngoại ngữ khi đã có AI dịch thuật?\" Trình bày hai quan điểm và ý kiến của bạn.",n:"~250 từ",h:"Dùng ít nhất 5 cấu trúc rào đón và 2 cấu trúc khẳng định mạnh. Có mở bài, 2 đoạn thân bài, kết luận.",
m:`With the rapid improvement of AI translation tools, some people have begun to question whether learning a foreign language is still worthwhile. While these tools are undoubtedly useful, I would argue that language learning remains essential.
On the one hand, it could be argued that translation apps have made language learning largely unnecessary for everyday purposes. Travellers can now read menus, ask for directions and even hold simple conversations through their phones. For businesses, automatic translation appears to reduce costs considerably, as documents can be translated in seconds. From this perspective, the time spent memorising grammar rules might seem difficult to justify.
On the other hand, there is no denying that communication involves far more than exchanging words. Machine translation tends to struggle with humour, cultural references and subtle shifts in tone, which are often crucial in negotiations and personal relationships. There is also some evidence to suggest that learning a language improves memory and problem-solving skills, benefits that no app can provide. Moreover, people who speak a client's language are generally perceived as more trustworthy and committed, which may give them a significant advantage in international business.
In conclusion, although AI translation is likely to become even more accurate, it is undeniable that genuine language skills offer deeper understanding and stronger human connections. To some extent, technology can support learners, but it should be seen as a tool rather than a replacement for learning.`}});

L.push({id:35,lv:"C1",vi:"Thức giả định và cấu trúc nâng cao",en:"Subjunctive: suggest that sb do, It's high time, as if",
th:`<ul><li><b>Giả định hiện tại</b> sau <b>suggest, recommend, insist, demand, propose, request</b> + <b>that + S + V nguyên mẫu</b> (không chia, kể cả ngôi thứ 3): <i>I suggest that he <b>take</b> a break.</i> Phủ định: <b>that + S + not + V</b>. (Anh-Anh hay dùng <b>should + V</b>.)</li>
<li>Sau <b>It is essential / vital / important / necessary + that + S + V nguyên mẫu</b>.</li>
<li><b>It's (high / about) time + S + V2</b>: đã đến lúc (lẽ ra phải làm rồi). Hoặc <b>It's time for + O + to V</b>.</li>
<li><b>as if / as though + S + V2 (were)</b>: như thể (không thật).</li>
<li><b>Advise / recommend + O + (not) to V</b>: khuyên ai làm gì.</li></ul>`,
f:["S + suggest/recommend/insist + that + S + (not) + V nguyên mẫu","It is essential/vital + that + S + V nguyên mẫu","It's (high) time + S + V2","S + V + as if / as though + S + V2/were"],
ex:[["The client insisted that the logo be bigger.","Khách hàng nhất quyết yêu cầu logo phải to hơn."],["It's high time you updated your portfolio.","Đã đến lúc bạn cập nhật portfolio rồi."],["She talks as if she knew everything.","Cô ấy nói chuyện như thể cô ấy biết hết mọi thứ."]],
mi:[["I suggest him to rest.","I suggest that he rest. / I suggest (that) he should rest.","suggest không đi với O + to V."],["It's time we go.","It's time we went. / It's time for us to go.","Sau It's time + S dùng V2."],["It is vital that she attends.","It is vital that she attend.","Giả định: nguyên mẫu (văn trang trọng)."]],
q:[["Bác sĩ đề nghị anh ấy nên nghỉ ngơi.",["The doctor suggested that he rest.","The doctor recommended that he rest.","The doctor suggested that he should rest.","The doctor recommended that he should rest.","The doctor suggested he rest.","The doctor recommended he rest.","The doctor advised him to rest.","The doctor suggested that he take a rest.","The doctor recommended that he take a rest."],"suggest that + S + V nguyên mẫu"],
["Đã đến lúc chúng ta phải hành động.",["It's high time we took action.","It is high time we took action.","It's time we took action.","It is time we took action.","It's high time we acted.","It is high time we acted.","It's time for us to act.","It is time for us to take action.","It's about time we took action."],"It's high time + S + V2"],
["Điều cần thiết là mọi nhân viên phải tham gia buổi đào tạo.",["It is essential that every employee attend the training.","It is essential that all employees attend the training.","It is essential that every employee attend the training session.","It is essential that all employees attend the training session.","It is essential that every employee should attend the training.","It is essential that all employees should attend the training.","It's essential that every employee attend the training.","It is essential that every employee attends the training.","It is essential that all staff attend the training."],"It is essential that + S + V nguyên mẫu"],
["Anh ấy nói chuyện như thể anh ấy là chuyên gia.",["He talks as if he were an expert.","He speaks as if he were an expert.","He talks as though he were an expert.","He speaks as though he were an expert.","He talks as if he was an expert.","He speaks as if he was an expert.","He talks like he is an expert."],"as if + S + were"],
["Tôi khuyên bạn không nên ký hợp đồng ngay.",["I recommend that you not sign the contract immediately.","I recommend that you not sign the contract right away.","I would advise you not to sign the contract immediately.","I would advise you not to sign the contract right away.","I advise you not to sign the contract immediately.","I advise you not to sign the contract right away.","I recommend that you don't sign the contract immediately.","I'd advise you not to sign the contract right away.","I suggest that you not sign the contract immediately.","I recommend that you should not sign the contract immediately."],"recommend that you not + V / advise + O + not to V"]],
w:{p:"Viết thư đề xuất (proposal) gửi quản lý hoặc khách hàng về một thay đổi trong quy trình làm việc.",n:"~250 từ",h:"Dùng ít nhất 3 câu giả định (suggest/recommend/insist that), 1 câu It is essential that, 1 câu It's high time, 1 câu as if.",
m:`Dear Mr. Pham,
I am writing to propose a change to the way our team handles client feedback, which I believe would save time and improve the quality of our work.
At present, clients send comments through emails, phone calls and messaging apps. As a result, important requests are sometimes missed, and our animators often feel as if they were working with several different clients at once. Last month alone, we spent an estimated 30 hours redoing scenes because of misunderstood instructions. It is high time we introduced a clearer system.
I recommend that all feedback be collected in a single online review tool, where clients can leave comments directly on specific frames of the video. I also suggest that each project have one designated contact person on the client's side, so that conflicting opinions are resolved before they reach us. Furthermore, it is essential that every revision request include a deadline and a priority level.
To make the transition smooth, I propose that we test the new process with two small projects next month. If the results are positive, we could apply it to all projects from the beginning of next quarter. I would also insist that the team receive a short training session, as the tool will only be effective if everyone uses it consistently.
I am confident that this change would reduce stress for our staff and lead to faster delivery for our clients. I would be happy to discuss the details at your convenience.
Yours sincerely,
Nam`}});

L.push({id:36,lv:"C1",vi:"Cấu trúc bài luận hoàn chỉnh",en:"Essay Structure & Cohesion (Capstone)",
th:`<p>Bài tổng kết: ghép tất cả cấu trúc đã học thành <b>một bài luận hoàn chỉnh</b> (dạng IELTS Task 2 / bài luận học thuật).</p>
<ul><li><b>Mở bài</b> (2–3 câu): giới thiệu chủ đề (paraphrase đề bài) + <b>luận điểm (thesis)</b> nêu rõ quan điểm và hướng triển khai.</li>
<li><b>Thân bài</b> (2–3 đoạn): mỗi đoạn có <b>câu chủ đề</b> → <b>giải thích</b> → <b>ví dụ cụ thể</b> → (liên hệ lại luận điểm).</li>
<li><b>Kết bài</b> (2–3 câu): nhắc lại quan điểm bằng từ khác, tóm tắt ý chính, có thể đưa khuyến nghị. Không thêm ý mới.</li>
<li><b>Liên kết</b>: thêm ý (Moreover, Furthermore), đối lập (However, On the other hand, Nevertheless), ví dụ (For instance, A case in point is), kết quả (Consequently, Therefore), kết luận (In conclusion, Overall).</li>
<li>Kết hợp đa dạng: câu điều kiện, bị động khách quan, mệnh đề quan hệ, đảo ngữ, rào đón, danh từ hóa.</li></ul>`,
f:["Mở bài: Nowadays, ... This essay will argue that ...","Thân bài: Firstly, ... For example, ... As a result, ...","Đối lập: On the other hand, it could be argued that ...","Kết bài: In conclusion, while ..., I firmly believe that ..."],
ex:[["A case in point is the rise of online education during the pandemic.","Một ví dụ điển hình là sự bùng nổ của giáo dục trực tuyến trong đại dịch."],["Overall, the advantages appear to outweigh the drawbacks.","Nhìn chung, ưu điểm dường như lớn hơn nhược điểm."]],
mi:[["In conclusion, there is another reason...","(Không đưa ý mới vào kết bài)","Kết bài chỉ tổng kết."],["On the other side,","On the other hand,","Cụm cố định."]],
q:[["Ngày nay, ngày càng nhiều người chọn làm việc từ xa.",["Nowadays, more and more people choose to work remotely.","Nowadays, more and more people are choosing to work remotely.","Nowadays, an increasing number of people choose to work remotely.","Nowadays, an increasing number of people are choosing to work remotely.","Nowadays, more and more people choose to work from home.","Nowadays, a growing number of people choose to work remotely.","Nowadays, a growing number of people are choosing to work remotely.","These days, more and more people choose to work remotely."],"more and more / an increasing number of"],
["Bài luận này sẽ thảo luận cả hai quan điểm trước khi đưa ra ý kiến cá nhân.",["This essay will discuss both views before giving a personal opinion.","This essay will discuss both views before giving my own opinion.","This essay will discuss both views before presenting a personal opinion.","This essay will discuss both sides before giving a personal opinion.","This essay will discuss both points of view before giving a personal opinion.","This essay will discuss both views before offering a personal opinion.","This essay will discuss both sides before presenting my own opinion.","This essay will discuss both perspectives before giving a personal opinion."],"This essay will + V"],
["Một mặt, làm việc từ xa giúp tiết kiệm thời gian; mặt khác, nó có thể gây cảm giác cô lập.",["On the one hand, working remotely saves time; on the other hand, it can cause a feeling of isolation.","On the one hand, remote work saves time; on the other hand, it may make people feel isolated.","On the one hand, working remotely saves time; on the other hand, it can make people feel isolated.","On the one hand, remote work saves time; on the other hand, it can make people feel isolated.","On the one hand, working from home saves time; on the other hand, it can cause feelings of isolation.","On the one hand, remote working saves time; on the other hand, it can lead to a sense of isolation.","On the one hand, working remotely helps save time; on the other hand, it can make people feel isolated.","On the one hand, working remotely saves time. On the other hand, it can make people feel isolated."],"On the one hand ...; on the other hand ..."],
["Một ví dụ điển hình là các nhà thiết kế tự do.",["A typical example is freelance designers.","A good example is freelance designers.","A case in point is freelance designers.","A prime example is freelance designers.","A typical example of this is freelance designers.","A good example of this is freelance designers.","A typical example is freelance designers."],"A case in point is / A typical example is"],
["Tóm lại, lợi ích của nó lớn hơn bất lợi.",["In conclusion, its benefits outweigh its drawbacks.","In conclusion, the benefits outweigh the drawbacks.","In conclusion, its advantages outweigh its disadvantages.","In conclusion, the advantages outweigh the disadvantages.","In conclusion, its benefits outweigh its disadvantages.","In short, its benefits outweigh its drawbacks.","In conclusion, the benefits outweigh the disadvantages."],"outweigh"]],
w:{p:"Some people believe that working from home is better than working in an office. To what extent do you agree or disagree? (Viết bằng tiếng Anh, không cần dịch)",n:"~300 từ",h:"Mở bài + 2 đoạn thân bài + kết bài. Cố gắng dùng ít nhất 1 cấu trúc từ mỗi cấp độ: thì hoàn thành, câu điều kiện, bị động khách quan, mệnh đề quan hệ, đảo ngữ, rào đón, danh từ hóa.",
m:`Since the pandemic, the number of people working from home has increased dramatically, and many now argue that remote work is superior to working in an office. While I accept that working from home offers considerable advantages, I believe that a combination of both arrangements is the most effective solution.
There is no denying that remote work brings significant benefits to employees. The elimination of daily commuting, which can take up to two hours in cities such as Hanoi or Ho Chi Minh City, gives workers more time for rest and family. Furthermore, people who work from home tend to have greater control over their schedules, and there is some evidence to suggest that this flexibility leads to higher productivity. A case in point is freelance designers, many of whom have been working remotely for years and consistently meet tight deadlines without supervision.
On the other hand, it could be argued that offices provide something that technology cannot replace. Not only do face-to-face meetings make communication faster, but they also help build trust and a sense of belonging. Junior employees, in particular, are believed to learn more quickly when they can observe experienced colleagues. Had many young graduates not been forced to start their careers online during the pandemic, they might have developed stronger professional networks. Moreover, the absence of a clear boundary between work and home life can result in longer working hours and a greater risk of burnout.
In conclusion, although working from home is undoubtedly more convenient for many people, it would be a mistake to abandon offices completely. In my view, it is essential that companies offer hybrid arrangements, allowing staff to enjoy the freedom of remote work while still benefiting from regular personal interaction.`}});

<script>
"use strict";
// ---------- state ----------
const KEY="vietwrite_v1";
let S=load();
function blank(){return {v:2,ts:0,cur:1,fs:20,les:{},mist:[],key:"",mdl:"claude-sonnet-5-5",mdlq:"claude-haiku-5-5",spent:0}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v)return Object.assign(blank(),s)}catch(e){}return blank()}
function save(){S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function LS(id){const st=S.les[id]||(S.les[id]={q:{},w:{},wf:{},done:false,gen:[]});if(typeof st.w==="string"){st.w={0:st.w};st.wf={0:st.wf||null}}if(!st.gen)st.gen=[];if(!st.wf)st.wf={};if(!st.w)st.w={};return st}
function applyFs(){document.documentElement.style.setProperty("--fs",S.fs+"px")}
applyFs();

// ---------- AI (Anthropic API) ----------
const API="https://api.anthropic.com/v1/messages";
function hasKey(){return !!(S.key&&S.key.trim())}
const aiState=()=>hasKey()?"ok":"off";
async function callClaude(prompt,quick,maxTokens){
  if(!hasKey())throw {code:"nokey"};
  const model=quick?(S.mdlq||"claude-haiku-5-5"):(S.mdl||"claude-sonnet-5-5");
  let res;
  try{res=await fetch(API,{method:"POST",headers:{"content-type":"application/json","x-api-key":S.key.trim(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model,max_tokens:maxTokens||1500,messages:[{role:"user",content:prompt}]})})}
  catch(e){throw {code:"net"}}
  if(!res.ok){let m="";try{m=(await res.json()).error.message}catch(e){}throw {code:"http",status:res.status,msg:m}}
  const j=await res.json();
  if(j.usage){S.spent=(S.spent||0)+(j.usage.input_tokens||0)+(j.usage.output_tokens||0)*4;save()}
  return (j.content||[]).map(c=>c.text||"").join("");
}
async function askJSON(prompt,quick,maxTokens){
  const t=await callClaude(prompt,quick,maxTokens);
  const m=t.match(/[\[{][\s\S]*[\]}]/);if(!m)throw {code:"parse"};
  try{return JSON.parse(m[0])}catch(e){throw {code:"parse"}}
}
function aiErr(e){
  if(!e)return "Lỗi không rõ.";
  if(e.code==="nokey")return "Chưa nhập API key. Vào Cài đặt để nhập.";
  if(e.code==="net")return "Không kết nối được tới Anthropic. Kiểm tra mạng (Wi-Fi) của máy.";
  if(e.code==="http"){if(e.status===401)return "API key không đúng. Kiểm tra lại trong Cài đặt.";if(e.status===429)return "Quá nhiều yêu cầu, chờ một lát rồi thử lại.";if(e.status===400&&/credit|balance/i.test(e.msg||""))return "Tài khoản Anthropic hết tiền (credit). Nạp thêm tại console.anthropic.com.";return "Lỗi từ máy chủ ("+e.status+"): "+(e.msg||"")}
  if(e.code==="parse")return "AI trả lời không đúng định dạng, hãy thử lại.";
  return "Không chấm được lần này. Hãy thử lại hoặc tự so với đáp án.";
}
// ---------- text utils ----------
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const BR={practis:"practic",realis:"realiz",recognis:"recogniz",finalis:"finaliz",organis:"organiz",apologis:"apologiz",neighbour:"neighbor",colour:"color",favour:"favor",behaviour:"behavior",centre:"center",travell:"travel",mum:"mom",grandma:"grandmother"};
function norm(s){
  s=String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  s=s.replace(/[’‘`´]/g,"'").replace(/\b([ap])\.\s?m\.?/g,"$1m").replace(/(\d),(\d)/g,"$1$2");
  s=s.replace(/\bwon't\b/g,"will not").replace(/\bcan't\b/g,"cannot").replace(/\bcan not\b/g,"cannot").replace(/\bshan't\b/g,"shall not")
     .replace(/n't\b/g," not").replace(/'m\b/g," am").replace(/'re\b/g," are").replace(/'ve\b/g," have").replace(/'ll\b/g," will").replace(/'d\b/g," would").replace(/'s\b/g," is");
  s=s.replace(/[^a-z0-9%]+/g," ").replace(/\be reader/g,"ereader").replace(/\bhard working\b/g,"hardworking").replace(/\bco working\b/g,"coworking");
  for(const k in BR)s=s.replace(new RegExp("\\b"+k,"g"),BR[k]);
  return s.replace(/\s+/g," ").trim();
}
function words(s){return norm(s).split(" ").filter(Boolean)}
function lcsDiff(a,b){ // a = user words, b = model words
  const n=a.length,m=b.length,d=[];for(let i=0;i<=n;i++){d[i]=new Array(m+1).fill(0)}
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=a[i]===b[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  const out=[];let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){out.push(["=",b[j]]);i++;j++}else if(d[i+1][j]>=d[i][j+1]){out.push(["-",a[i]]);i++}else{out.push(["+",b[j]]);j++}}
  while(i<n)out.push(["-",a[i++]]);while(j<m)out.push(["+",b[j++]]);return {ops:out,common:d[0][0]};
}
function closest(user,list){let best=list[0],bs=-1;const uw=words(user);for(const x of list){const xw=words(x);const c=lcsDiff(uw,xw).common;const sc=2*c/(uw.length+xw.length||1);if(sc>bs){bs=sc;best=x}}return best}
function diffHTML(user,model){const r=lcsDiff(words(user),words(model)).ops;return r.map(([o,w])=>o==="="?esc(w):o==="+"?"<ins>"+esc(w)+"</ins>":"<del>"+esc(w)+"</del>").join(" ")}
function wc(s){return (String(s).trim().match(/[A-Za-zÀ-ỹ0-9'’-]+/g)||[]).length}

// ---------- routing ----------
let view={name:"home"};
let P=null; // practice session
let step="learn";
function go(h){if(location.hash==="#"+h)route();else location.hash=h}
window.addEventListener("hashchange",()=>{P=null;route()});
function route(){
  const h=location.hash.replace("#","");
  let m;
  if((m=h.match(/^lesson-(\d+)$/))&&L.find(x=>x.id==+m[1])){const id=+m[1];if(view.name!=="lesson"||view.id!==id){step="learn";P=null}view={name:"lesson",id,wi:view.id===id?view.wi:0};S.cur=id;save();renderLesson()}
  else if(h==="review"){view={name:"review"};renderReview()}
  else if(h==="settings"){view={name:"settings"};renderSettings()}
  else {view={name:"home"};renderHome()}
  scrollTop();
}
const $app=document.getElementById("app");
function scrollTop(){try{window.scrollTo(0,0)}catch(e){}}
function hdr(left,title){return `<div class="top"><div class="row">${left}</div><div class="ttl">${title||""}</div><div class="row"><button class="tiny" data-a="fs-">A−</button><button class="tiny" data-a="fs+">A+</button></div></div>`}
function lessonScore(id){const st=S.les[id];if(!st)return null;const l=L.find(x=>x.id===id);const vals=Object.values(st.q);const ok=vals.filter(x=>x.ok).length;return {ok,tot:l.q.length+(st.gen||[]).length,done:st.done,answered:vals.length}}
function rerender(){if(view.name==="lesson")renderLesson();else if(view.name==="review")renderReview();else if(view.name==="settings")renderSettings();else renderHome()}

// ---------- home ----------
function renderHome(){
  const done=L.filter(l=>S.les[l.id]&&S.les[l.id].done).length;
  const next=(L.find(l=>!(S.les[l.id]&&S.les[l.id].done))||L[L.length-1]);
  const cur=L.find(l=>l.id===S.cur)||next;
  const resume=(S.les[cur.id]&&!S.les[cur.id].done)?cur:next;
  let h=hdr(`<span class="ttl">✎ Luyện viết</span>`,"");
  h+=`<h1>Luyện viết tiếng Anh<br>A2 → C1</h1>
  <p class="small muted">36 bài · mỗi bài một cấu trúc · 540 câu dịch · 108 đề viết · AI chấm và tạo thêm bài</p>
  <div class="box thick"><div class="row sp"><b>Tiến độ: ${done}/${L.length} bài</b><span class="small">${Math.round(done/L.length*100)}%</span></div>
  <div class="bar"><i style="width:${done/L.length*100}%"></i></div>
  <button class="pri full mt" data-go="lesson-${resume.id}">${done===0&&!S.les[resume.id]?"Bắt đầu":"Học tiếp"}: Bài ${resume.id} · ${esc(resume.vi)} →</button>
  <div class="row mt"><button class="ghost" data-go="review" style="flex:1">Sổ lỗi (${S.mist.length})</button><button class="ghost" data-go="settings" style="flex:1">Cài đặt${hasKey()?"":" ⚠ chưa có API key"}</button></div></div>`;
  const lvName={A2:"Sơ cấp",B1:"Trung cấp",B2:"Trung cao cấp",C1:"Cao cấp"};
  for(const lv of ["A2","B1","B2","C1"]){
    const ls=L.filter(l=>l.lv===lv);const d=ls.filter(l=>S.les[l.id]&&S.les[l.id].done).length;
    h+=`<div class="lv"><h2>${lv} · ${lvName[lv]}</h2><span class="small"><b>${d}/${ls.length}</b></span></div>`;
    for(const l of ls){const sc=lessonScore(l.id);let s="";if(sc){s=sc.done?`✓ ${sc.ok}/${sc.answered}`:(sc.answered?`… ${sc.ok}/${sc.answered}`:"")}
      h+=`<button class="ls" data-go="lesson-${l.id}"><span class="n">${String(l.id).padStart(2,"0")}</span><span class="t">${esc(l.vi)}<span class="e">${esc(l.en)}</span></span><span class="s">${s}</span></button>`}
  }
  $app.innerHTML=h;
}

// ---------- lesson ----------
function renderLesson(){
  const l=L.find(x=>x.id===view.id);
  let h=hdr(`<button class="tiny" data-go="home">← Danh sách</button>`,`${l.lv} · Bài ${l.id}/${L.length}`);
  h+=`<h2>${esc(l.vi)}</h2><p class="small muted" style="margin-top:-.3em">${esc(l.en)}</p>`;
  h+=`<div class="steps"><button data-step="learn" class="${step==="learn"?"on":""}">1 · Học</button><button data-step="practice" class="${step==="practice"?"on":""}">2 · Dịch câu</button><button data-step="write" class="${step==="write"?"on":""}">3 · Viết</button></div>`;
  if(step==="learn")h+=learnHTML(l);
  else if(step==="practice")h+=(P&&P.mode==="lesson"&&P.lid===l.id)?practiceHTML():setPickerHTML(l);
  else if(step==="write")h+=writeHTML(l);
  else if(step==="done")h+=doneHTML(l);
  $app.innerHTML=h;
  bindInputs();
}
function formulaBox(l){return `<div class="box thick formula">${l.f.map(x=>`<div>${esc(x)}</div>`).join("")}</div>`}
function learnHTML(l){
  let h=`<h3>Khi nào dùng</h3>${l.th}<h3>Công thức</h3>${formulaBox(l)}<h3>Ví dụ</h3>`;
  h+=l.ex.map(e=>`<div class="ex"><div>${esc(e[0])}</div><div class="vi">${esc(e[1])}</div></div>`).join("");
  h+=`<h3>Lỗi hay gặp</h3>`+l.mi.map(m=>`<div class="mi">✗ <span class="w">${esc(m[0])}</span><br>✓ <b>${esc(m[1])}</b><br><span class="small muted">${esc(m[2])}</span></div>`).join("");
  h+=`<div class="row end mt"><button class="pri" data-step="practice">Bắt đầu dịch câu →</button></div>`;
  return h;
}
// sets of 5
function setPickerHTML(l){

2. Create 6 NEW Vietnamese sentences that specifically force the learner to practise those problems, at about the same level as the mistakes. For each give 3-5 acceptable English translations and a short Vietnamese hint.
