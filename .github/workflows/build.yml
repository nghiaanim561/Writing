name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk LuyenViet.apk
      - uses: actions/upload-artifact@v4
        with: { name: LuyenViet-apk, path: LuyenViet.apk }
      - name: Publish as release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Luyện viết – bản mới nhất
          body: "Tải file LuyenViet.apk bên dưới và cài lên máy Boox."
          files: LuyenViet.apk
          prerelease: false
